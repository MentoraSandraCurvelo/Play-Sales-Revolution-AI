<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presencia IAM™ en Latinoamérica</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .globe-wrapper {
    width: 100%;
    max-width: 580px;
    padding: 1.6rem 1rem 1rem;
    position: relative;
    text-align: center;
  }
  .globe-label-top {
    font-size: 11px;
    letter-spacing: 4px;
    color: #C00000;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .globe-label-sub {
    font-size: 15px;
    font-weight: 300;
    color: #666;
    margin-bottom: 1rem;
  }
  #gc {
    display: block;
    margin: 0 auto;
    cursor: grab;
  }
  #gc:active { cursor: grabbing; }
  .globe-hint {
    font-size: 10px;
    color: #444;
    margin-top: 0.6rem;
    letter-spacing: 1px;
  }
  #loading {
    color: #C00000;
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 1rem;
    display: block;
  }
</style>
</head>
<body>
<div class="globe-wrapper">
  <div class="globe-label-top">Presencia IAM™</div>
  <div class="globe-label-sub">8 países · Latinoamérica</div>
  <canvas id="gc"></canvas>
  <span id="loading">Cargando mapa...</span>
  <div class="globe-hint">↺ Arrastra para rotar &nbsp;·&nbsp; Scroll para zoom</div>
</div>

<!-- D3 v7 -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<!-- TopoJSON client -->
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────
//  IAM™ GLOBE — D3 Orthographic + GeoJSON real
//  Sandra Curvelo · iamlatam.co
// ─────────────────────────────────────────────────────────────────

const IAM_COUNTRIES = new Set([
  "Colombia","Mexico","Peru","Argentina",
  "Ecuador","Panama","Costa Rica","Brazil"
]);

const DISPLAY_NAMES = {
  "Colombia":"IAM Colombia","Mexico":"IAM México",
  "Peru":"IAM Perú","Argentina":"IAM Argentina",
  "Ecuador":"IAM Ecuador","Panama":"IAM Panamá",
  "Costa Rica":"IAM Costa Rica","Brazil":"IAM Brasil"
};

// Centros geográficos para labels
const IAM_CENTERS = {
  "Colombia":   { ll:[4.57,-74.29],   ox:44,  oy:-18 },
  "Mexico":     { ll:[23.63,-102.55], ox:0,   oy:-22 },
  "Peru":       { ll:[-9.19,-75.01],  ox:0,   oy:22  },
  "Argentina":  { ll:[-38.42,-63.62], ox:0,   oy:20  },
  "Ecuador":    { ll:[-1.83,-78.18],  ox:-44, oy:14  },
  "Panama":     { ll:[8.99,-79.52],   ox:50,  oy:22  },
  "Costa Rica": { ll:[9.75,-83.75],   ox:-52, oy:-8  },
  "Brazil":     { ll:[-14.24,-51.93], ox:26,  oy:0   },
};

const canvas  = document.getElementById("gc");
const loading = document.getElementById("loading");
const wrap    = canvas.parentElement;

function getSize() { return Math.min(wrap.clientWidth - 24, 540); }
let SZ = getSize();
canvas.width  = SZ;
canvas.height = SZ;
const ctx = canvas.getContext("2d");

// Projection state
let rotX = 0.06,  rotY = -1.38;   // radians → lon/lat offset
let zoom = 1.0;
let isDrag = false, mx0 = 0, my0 = 0;
let autoSpin = true;
let frame = 0;
let world = null;
let countries = null;
let countriesMesh = null;

// D3 projection
function makeProj() {
  return d3.geoOrthographic()
    .scale((SZ / 2 - 2) * zoom)
    .translate([SZ / 2, SZ / 2])
    .rotate([rotY * 180 / Math.PI, -rotX * 180 / Math.PI, 0])
    .clipAngle(90);
}

function isVisible(lon, lat) {
  const proj = makeProj();
  const dist = d3.geoDistance([lon, lat],
    [-rotY * 180/Math.PI, rotX * 180/Math.PI]);
  return dist < Math.PI / 2;
}

function draw() {
  ctx.clearRect(0, 0, SZ, SZ);
  const proj = makeProj();
  const path = d3.geoPath(proj, ctx);

  // Ocean
  ctx.beginPath();
  path({ type: "Sphere" });
  ctx.fillStyle = "#1565a8";
  ctx.fill();
  ctx.strokeStyle = "#1e7acc";
  ctx.lineWidth = 1;
  ctx.stroke();

  if (!world) return;

  // Graticule
  ctx.beginPath();
  path(d3.geoGraticule()());
  ctx.strokeStyle = "rgba(255,255,255,0.07)";
  ctx.lineWidth = 0.4;
  ctx.stroke();

  // Non-IAM countries
  countries.features.forEach(f => {
    const name = f.properties.name;
    if (IAM_COUNTRIES.has(name)) return;
    ctx.beginPath(); path(f);
    ctx.fillStyle = "#1c5230";
    ctx.fill();
  });

  // Country borders mesh
  ctx.beginPath();
  path(countriesMesh);
  ctx.strokeStyle = "rgba(0,0,0,0.5)";
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // IAM countries — red
  countries.features.forEach(f => {
    const name = f.properties.name;
    if (!IAM_COUNTRIES.has(name)) return;
    ctx.beginPath(); path(f);
    ctx.fillStyle = "#C00000";
    ctx.fill();
    ctx.strokeStyle = "#ff4444";
    ctx.lineWidth = 1.0;
    ctx.stroke();
  });

  // Globe edge vignette
  const grd = ctx.createRadialGradient(SZ/2, SZ/2, (SZ/2-2)*zoom*0.75, SZ/2, SZ/2, (SZ/2-2)*zoom);
  grd.addColorStop(0, "rgba(0,0,0,0)");
  grd.addColorStop(1, "rgba(0,0,0,0.5)");
  ctx.beginPath();
  path({ type: "Sphere" });
  ctx.fillStyle = grd;
  ctx.fill();

  // IAM Labels
  const proj2 = makeProj();
  Object.entries(IAM_CENTERS).forEach(([key, cfg]) => {
    const [lat, lon] = cfg.ll;
    if (!isVisible(lon, lat)) return;
    const pt = proj2([lon, lat]);
    if (!pt) return;
    const lx = pt[0] + cfg.ox;
    const ly = pt[1] + cfg.oy;
    const label = DISPLAY_NAMES[key];

    ctx.font = "bold 11.5px 'Helvetica Neue',Helvetica,Arial,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = "rgba(0,0,0,0.98)";
    ctx.shadowColor = "rgba(0,0,0,1)";
    ctx.shadowBlur = 10;
    ctx.strokeText(label, lx, ly);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(label, lx, ly);
  });
}

// Load world data
Promise.all([
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r => r.json()),
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(r => r.json())
]).then(([topo110, topo50]) => {
  // Use 50m for higher quality
  const topo = topo50;
  world = topo;

  // Convert to GeoJSON
  const raw = topojson.feature(topo, topo.objects.countries);

  // Map numeric IDs to country names
  const ID_TO_NAME = {
    "004":"Afghanistan","008":"Albania","012":"Algeria","024":"Angola",
    "032":"Argentina","036":"Australia","040":"Austria","050":"Bangladesh",
    "056":"Belgium","068":"Bolivia","076":"Brazil","100":"Bulgaria",
    "104":"Myanmar","116":"Cambodia","120":"Cameroon","124":"Canada",
    "144":"Sri Lanka","152":"Chile","156":"China","170":"Colombia",
    "180":"DR Congo","188":"Costa Rica","191":"Croatia","192":"Cuba",
    "196":"Cyprus","203":"Czech Republic","208":"Denmark","218":"Ecuador",
    "818":"Egypt","222":"El Salvador","246":"Finland","250":"France",
    "276":"Germany","288":"Ghana","300":"Greece","320":"Guatemala",
    "332":"Haiti","340":"Honduras","348":"Hungary","356":"India",
    "360":"Indonesia","364":"Iran","368":"Iraq","372":"Ireland",
    "376":"Israel","380":"Italy","388":"Jamaica","392":"Japan",
    "400":"Jordan","398":"Kazakhstan","404":"Kenya","410":"South Korea",
    "414":"Kuwait","418":"Laos","422":"Lebanon","428":"Latvia",
    "440":"Lithuania","442":"Luxembourg","458":"Malaysia","484":"Mexico",
    "504":"Morocco","508":"Mozambique","516":"Namibia","524":"Nepal",
    "528":"Netherlands","554":"New Zealand","558":"Nicaragua","566":"Nigeria",
    "578":"Norway","586":"Pakistan","591":"Panama","600":"Paraguay",
    "604":"Peru","608":"Philippines","616":"Poland","620":"Portugal",
    "630":"Puerto Rico","634":"Qatar","642":"Romania","643":"Russia",
    "682":"Saudi Arabia","686":"Senegal","694":"Sierra Leone","703":"Slovakia",
    "705":"Slovenia","706":"Somalia","710":"South Africa","724":"Spain",
    "752":"Sweden","756":"Switzerland","760":"Syria","764":"Thailand",
    "792":"Turkey","800":"Uganda","804":"Ukraine","784":"UAE",
    "826":"United Kingdom","840":"United States","858":"Uruguay",
    "862":"Venezuela","704":"Vietnam","887":"Yemen","894":"Zambia",
    "716":"Zimbabwe"
  };

  raw.features.forEach(f => {
    const id = String(f.id).padStart(3, "0");
    f.properties = { name: ID_TO_NAME[id] || "Unknown" };
  });

  countries = raw;
  countriesMesh = topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b);

  loading.style.display = "none";
  draw();
  animate();
}).catch(err => {
  loading.textContent = "Error cargando mapa. Verifica conexión a internet.";
  console.error(err);
});

// ── Interaction ────────────────────────────────
canvas.addEventListener("mousedown", e => {
  isDrag = true; autoSpin = false;
  mx0 = e.clientX; my0 = e.clientY;
  canvas.style.cursor = "grabbing";
});
window.addEventListener("mouseup", () => {
  isDrag = false;
  canvas.style.cursor = "grab";
  setTimeout(() => { autoSpin = true; }, 2500);
});
canvas.addEventListener("mousemove", e => {
  if (!isDrag) return;
  rotY -= (e.clientX - mx0) * 0.006 / zoom;
  rotX += (e.clientY - my0) * 0.004 / zoom;
  rotX  = Math.max(-1.3, Math.min(1.3, rotX));
  mx0 = e.clientX; my0 = e.clientY;
  draw();
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoom = Math.max(0.7, Math.min(3.0, zoom * (1 - e.deltaY * 0.001)));
  draw();
}, { passive: false });

let lt = null;
canvas.addEventListener("touchstart",  e => { lt = e.touches[0]; autoSpin = false; });
canvas.addEventListener("touchend",    () => { setTimeout(() => { autoSpin = true; }, 2500); });
canvas.addEventListener("touchmove",   e => {
  e.preventDefault();
  if (!lt) return;
  rotY -= (e.touches[0].clientX - lt.clientX) * 0.006 / zoom;
  rotX += (e.touches[0].clientY - lt.clientY) * 0.004 / zoom;
  rotX  = Math.max(-1.3, Math.min(1.3, rotX));
  lt = e.touches[0]; draw();
}, { passive: false });

window.addEventListener("resize", () => {
  SZ = getSize();
  canvas.width  = SZ;
  canvas.height = SZ;
  draw();
});

function animate() {
  requestAnimationFrame(animate);
  frame++;
  if (autoSpin && !isDrag && frame % 2 === 0) {
    rotY += 0.003;
    draw();
  }
}
</script>
</body>
</html>
