<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivo IAM Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --rojo:#B71C1C; --rojo-suave:#FBEEEE;
  --alto:#BF360C; --alto-suave:#FBECE6;
  --medio:#A98105; --medio-suave:#FAF3DF;
  --verde:#00897B; --verde-suave:#E4F3F1;
  --tinta:#1A1614; --tinta-2:#4A423F; --tinta-3:#7C7370;
  --fondo:#FAF8F7; --papel:#FFFFFF; --papel-2:#F5F2F1;
  --linea:#E4DEDC; --linea-suave:#EFEAE8;
  --rail:#1A1614; --rail-2:#231D1B; --rail-tinta:#EFE9E7; --rail-tinta-2:#A79E9A;
  --rail-sel:#B71C1C;
  --sombra:0 1px 2px rgba(26,22,20,.05),0 8px 24px rgba(26,22,20,.06);
  --serif:Caladea,Cambria,Georgia,serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --rojo:#E76060; --rojo-suave:#2E1C1B;
    --alto:#EC6C3C; --alto-suave:#2D1D17;
    --medio:#DCB233; --medio-suave:#2B2413;
    --verde:#3FCBAE; --verde-suave:#142825;
    --tinta:#F3EEEC; --tinta-2:#C3B9B5; --tinta-3:#8B807C;
    --fondo:#151110; --papel:#1E1917; --papel-2:#262020;
    --linea:#332B29; --linea-suave:#2A2322;
    --rail:#100D0C; --rail-2:#1A1514; --rail-tinta:#F3EEEC; --rail-tinta-2:#8B807C;
    --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --rojo:#E76060; --rojo-suave:#2E1C1B;
  --alto:#EC6C3C; --alto-suave:#2D1D17;
  --medio:#DCB233; --medio-suave:#2B2413;
  --verde:#3FCBAE; --verde-suave:#142825;
  --tinta:#F3EEEC; --tinta-2:#C3B9B5; --tinta-3:#8B807C;
  --fondo:#151110; --papel:#1E1917; --papel-2:#262020;
  --linea:#332B29; --linea-suave:#2A2322;
  --rail:#100D0C; --rail-2:#1A1514; --rail-tinta:#F3EEEC; --rail-tinta-2:#8B807C;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overflow:hidden;
}
h1,h2,h3,h4{font-family:var(--serif);margin:0;text-wrap:balance;}
a{color:var(--rojo);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;}
::selection{background:var(--rojo-suave);}

/* ───────── armazón ───────── */
.app{display:grid;grid-template-columns:272px 1fr;height:100vh;height:100dvh;}

/* ───────── rail ───────── */
.rail{
  background:var(--rail);color:var(--rail-tinta);display:flex;flex-direction:column;
  min-height:0;border-right:1px solid rgba(255,255,255,.06);
}
.marca{
  padding:18px 18px 14px;display:flex;align-items:center;gap:10px;flex:none;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.anillo{
  width:15px;height:15px;border-radius:50%;border:3px solid var(--rail-sel);flex:none;
}
.marca .t{font-family:var(--serif);font-weight:700;font-size:14.5px;letter-spacing:.01em;line-height:1.15;}
.marca .s{display:block;font-family:var(--sans);font-weight:400;font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--rail-tinta-2);margin-top:2px;}
.marca .tema{margin-left:auto;font-size:15px;opacity:.5;padding:4px;line-height:1;transition:opacity .15s;}
.marca .tema:hover{opacity:1;}

.buscar{padding:12px 14px 10px;flex:none;position:relative;}
.buscar input{
  width:100%;background:var(--rail-2);border:1px solid rgba(255,255,255,.09);
  border-radius:9px;color:var(--rail-tinta);padding:8px 30px 8px 31px;font-size:13.5px;
  font-family:inherit;outline:none;transition:border-color .15s,background .15s;
}
.buscar input::placeholder{color:var(--rail-tinta-2);}
.buscar input:focus{border-color:var(--rail-sel);background:#000;}
.buscar .lupa{position:absolute;left:24px;top:50%;transform:translateY(-50%);
  font-size:12px;opacity:.45;pointer-events:none;}
.buscar .limpiar{position:absolute;right:23px;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--rail-tinta-2);display:none;line-height:1;padding:2px 4px;}
.buscar.activo .limpiar{display:block;}

.rail-scroll{flex:1;overflow-y:auto;padding:4px 8px 24px;scrollbar-width:thin;}
.rail-scroll::-webkit-scrollbar{width:8px;}
.rail-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}
.grupo{
  padding:14px 10px 5px;font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--rail-tinta-2);display:flex;align-items:center;gap:6px;
}
.grupo .cuenta{margin-left:auto;font-weight:400;letter-spacing:.04em;opacity:.7;}
.item{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:6px 10px;border-radius:7px;font-size:13.5px;color:var(--rail-tinta);
  opacity:.82;transition:background .12s,opacity .12s;line-height:1.35;
}
.item:hover{background:rgba(255,255,255,.055);opacity:1;}
.item.sel{background:var(--rail-sel);opacity:1;font-weight:500;color:#fff;}
.item .gato{opacity:.5;font-weight:400;flex:none;}
.item.sel .gato{opacity:.75;}
.item .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .n{
  margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--rail-tinta-2);flex:none;padding-left:6px;
}
.item.sel .n{color:rgba(255,255,255,.8);}
.item .punto{width:5px;height:5px;border-radius:50%;background:var(--rail-sel);flex:none;margin-right:1px;}
.item.sel .punto{background:#fff;}

/* ───────── panel ───────── */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--fondo);}
.cab{
  flex:none;background:var(--papel);border-bottom:1px solid var(--linea);
  padding:14px 28px 0;
}
.cab-fila{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.menu-btn{display:none;font-size:19px;padding:2px 8px 2px 0;color:var(--tinta-2);}
.cab h1{font-size:23px;font-weight:700;line-height:1.15;display:flex;align-items:baseline;gap:7px;}
.cab h1 .gato{color:var(--tinta-3);font-family:var(--sans);font-weight:400;font-size:20px;}
.cab .meta{font-size:12.5px;color:var(--tinta-3);margin-top:3px;line-height:1.5;}
.cab .meta b{font-weight:500;color:var(--tinta-2);font-variant-numeric:tabular-nums;}
.cab .meta .sep{opacity:.4;margin:0 6px;}
.pestanas{display:flex;gap:2px;margin-top:13px;overflow-x:auto;scrollbar-width:none;}
.pestanas::-webkit-scrollbar{display:none;}
.pestanas button{
  padding:7px 13px 9px;font-size:13px;font-weight:500;color:var(--tinta-3);
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s;
}
.pestanas button:hover{color:var(--tinta);}
.pestanas button.sel{color:var(--rojo);border-bottom-color:var(--rojo);}
.pestanas button .n{
  font-size:11px;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums;
  background:var(--papel-2);padding:1px 5px;border-radius:20px;
}
.pestanas button.sel .n{background:var(--rojo-suave);opacity:1;}

.cuerpo{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:0 0 64px;scroll-behavior:smooth;}
.cuerpo::-webkit-scrollbar{width:11px;}
.cuerpo::-webkit-scrollbar-thumb{background:var(--linea);border-radius:6px;border:3px solid var(--fondo);}
.lienzo{max-width:830px;margin:0 auto;padding:0 28px;min-width:0;}

/* ───────── mensajes ───────── */
.dia{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:20px 0 12px;background:linear-gradient(var(--fondo) 66%,transparent);
}
.dia .linea{flex:1;height:1px;background:var(--linea);}
.dia .et{
  font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--tinta-3);background:var(--papel);border:1px solid var(--linea);
  padding:3px 11px;border-radius:20px;flex:none;
}
.msg{display:flex;gap:11px;padding:7px 10px;border-radius:9px;margin:0 -10px;transition:background .12s;}
.msg:hover{background:var(--papel-2);}
.msg.seguido{padding-top:1px;}
.msg.seguido .av{visibility:hidden;height:0;}
.av{
  width:33px;height:33px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:600;color:#fff;letter-spacing:-.01em;margin-top:2px;
}
.msg .col{min-width:0;flex:1;}
.msg .firma{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:1px;}
.msg .autor{font-weight:600;font-size:14px;}
.msg .hora{font-size:11px;color:var(--tinta-3);font-variant-numeric:tabular-nums;}
.msg .sello{
  font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  background:var(--papel-2);color:var(--tinta-3);padding:1px 5px;border-radius:3px;
}
.txt{font-size:14.5px;line-height:1.62;overflow-wrap:break-word;}
.txt p{margin:0 0 7px;}
.txt p:last-child{margin-bottom:0;}
.txt strong{font-weight:600;}
.txt code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--papel-2);border:1px solid var(--linea-suave);
  padding:.5px 4px;border-radius:4px;color:var(--alto);
}
.txt pre{
  background:var(--papel-2);border:1px solid var(--linea);border-radius:8px;
  padding:11px 13px;overflow-x:auto;font-size:12.5px;margin:8px 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;
}
.txt blockquote{
  margin:8px 0;padding:2px 0 2px 13px;border-left:3px solid var(--linea);
  color:var(--tinta-2);font-style:italic;
}
.txt .men{
  background:var(--rojo-suave);color:var(--rojo);padding:.5px 4px;
  border-radius:4px;font-weight:500;white-space:nowrap;
}
.txt .vin{word-break:break-all;}
.txt .bala{display:block;padding-left:15px;text-indent:-15px;}
.msg.sis .txt{font-size:12.5px;color:var(--tinta-3);font-style:italic;}
.msg.sis .av{background:none!important;border:1px dashed var(--linea);}
.sistema-oculto{display:none!important;}

.adj{
  display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px;
  background:var(--papel);border:1px solid var(--linea);border-left:3px solid var(--rojo);
  border-radius:8px;max-width:520px;
}
.adj .ico{font-size:17px;flex:none;line-height:1;}
.adj .nom{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.adj .sub{font-size:11px;color:var(--tinta-3);margin-top:1px;}
.hilo{
  display:inline-flex;align-items:center;gap:7px;margin-top:7px;padding:4px 10px 4px 8px;
  border:1px solid var(--linea);border-radius:20px;font-size:12px;color:var(--rojo);
  background:var(--papel);font-weight:500;
}
.reacc{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.reacc span{
  font-size:12px;background:var(--papel);border:1px solid var(--linea);
  padding:2px 8px;border-radius:20px;font-variant-numeric:tabular-nums;
}

/* ───────── actas ───────── */
.rejilla{display:grid;gap:13px;padding-top:22px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));}
.tarjeta{
  background:var(--papel);border:1px solid var(--linea);border-radius:12px;
  padding:15px 16px;text-align:left;width:100%;transition:transform .15s,box-shadow .15s,border-color .15s;
}
.tarjeta:hover{transform:translateY(-2px);box-shadow:var(--sombra);border-color:var(--rojo);}
.tarjeta .s{
  font-family:var(--serif);font-weight:700;font-size:26px;color:var(--rojo);line-height:1;
  font-variant-numeric:tabular-nums;
}
.tarjeta .s small{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;opacity:.7;display:block;margin-bottom:2px;}
.tarjeta .f{font-size:13px;font-weight:500;margin-top:7px;}
.tarjeta .m{font-size:11.5px;color:var(--tinta-3);margin-top:3px;}
.tarjeta .chips{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
.chip{
  font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:var(--papel-2);color:var(--tinta-3);
}
.chip.r{background:var(--rojo-suave);color:var(--rojo);}
.chip.v{background:var(--verde-suave);color:var(--verde);}
.chip.m{background:var(--medio-suave);color:var(--medio);}

.acta{padding-top:22px;}
.acta .volver{
  font-size:13px;color:var(--tinta-3);font-weight:500;display:inline-flex;
  align-items:center;gap:6px;margin-bottom:16px;
}
.acta .volver:hover{color:var(--rojo);}
.acta-cab{
  background:var(--rojo);color:#fff;border-radius:13px 13px 0 0;padding:22px 24px 20px;
}
.acta-cab .arr{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;opacity:.82;margin-bottom:9px;}
.acta-cab .arr .anillo{border-color:#fff;width:11px;height:11px;border-width:2.5px;}
.acta-cab h2{font-size:25px;font-weight:700;line-height:1.14;}
.acta-cab .sub{font-size:13px;opacity:.9;margin-top:6px;}
.kpis{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  background:var(--papel);border:1px solid var(--linea);border-top:0;
}
.kpi{padding:15px 16px;border-right:1px solid var(--linea-suave);}
.kpi:last-child{border-right:0;}
.kpi .v{font-family:var(--serif);font-weight:700;font-size:25px;color:var(--rojo);
  line-height:1;font-variant-numeric:tabular-nums;}
.kpi .e{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--tinta-3);margin-top:6px;line-height:1.35;}
.bloque{
  background:var(--papel);border:1px solid var(--linea);border-top:0;padding:20px 24px;
}
.bloque:last-child{border-radius:0 0 13px 13px;}
.bloque h3{
  font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--rojo);padding-bottom:7px;
  border-bottom:1.5px solid var(--rojo);margin-bottom:14px;
}
.bloque ul{margin:0;padding-left:19px;}
.bloque li{margin-bottom:7px;font-size:14px;line-height:1.55;}
.bloque li:last-child{margin-bottom:0;}
.gente{display:flex;flex-wrap:wrap;gap:8px;}
.persona{
  display:flex;align-items:center;gap:8px;background:var(--papel-2);
  border:1px solid var(--linea-suave);border-radius:20px;padding:4px 12px 4px 5px;font-size:13px;
}
.persona .av{width:24px;height:24px;border-radius:50%;font-size:10px;margin:0;}
.persona.no{opacity:.5;text-decoration:line-through;}
table.tareas{width:100%;border-collapse:collapse;font-size:13.5px;}
table.tareas th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-3);font-weight:600;padding:0 10px 7px 0;border-bottom:1px solid var(--linea);
}
table.tareas td{padding:9px 10px 9px 0;border-bottom:1px solid var(--linea-suave);vertical-align:top;}
table.tareas tr:last-child td{border-bottom:0;}
table.tareas td.q{font-weight:500;white-space:nowrap;}
.alerta{
  border-left:3px solid var(--rojo);background:var(--rojo-suave);
  padding:11px 14px;border-radius:0 8px 8px 0;margin-bottom:9px;font-size:13.5px;
}
.alerta:last-child{margin-bottom:0;}
.alerta.a{border-color:var(--alto);background:var(--alto-suave);}
.alerta.m{border-color:var(--medio);background:var(--medio-suave);}

/* ───────── fijados ───────── */
.carpeta{
  background:var(--papel);border:1px solid var(--linea);border-radius:12px;
  padding:16px 18px;margin-bottom:13px;
}
.carpeta h3{
  font-family:var(--sans);font-size:13.5px;font-weight:600;display:flex;
  align-items:center;gap:9px;margin-bottom:11px;
}
.carpeta h3 .n{margin-left:auto;font-size:11px;font-weight:400;color:var(--tinta-3);}
.enlace{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  font-size:13.5px;transition:background .12s;color:var(--tinta);
}
.enlace:hover{background:var(--papel-2);text-decoration:none;}
.enlace .ico{opacity:.55;flex:none;}
.enlace .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.enlace .u{font-size:11px;color:var(--tinta-3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.enlace .fl{margin-left:auto;opacity:.35;flex:none;}

/* ───────── resultados y vacíos ───────── */
.res{
  display:block;width:100%;text-align:left;background:var(--papel);
  border:1px solid var(--linea);border-radius:10px;padding:12px 15px;margin-bottom:9px;
  transition:border-color .12s,box-shadow .12s;
}
.res:hover{border-color:var(--rojo);box-shadow:var(--sombra);}
.res .arr{display:flex;align-items:baseline;gap:9px;margin-bottom:5px;flex-wrap:wrap;}
.res .ca{font-size:12px;font-weight:600;color:var(--rojo);}
.res .au{font-size:12px;color:var(--tinta-2);}
.res .fe{font-size:11px;color:var(--tinta-3);margin-left:auto;font-variant-numeric:tabular-nums;}
.res .ex{font-size:13.5px;color:var(--tinta-2);line-height:1.5;}
mark{background:#FFE9A8;color:inherit;border-radius:2px;padding:0 1px;font-weight:500;}
:root[data-theme="dark"] mark{background:#4A3B10;color:#FFE9A8;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) mark{background:#4A3B10;color:#FFE9A8;}
}
.vacio{
  text-align:center;padding:64px 24px;color:var(--tinta-3);
}
.vacio .gran{font-size:34px;opacity:.3;margin-bottom:12px;}
.vacio p{margin:0;font-size:14px;max-width:420px;margin-inline:auto;line-height:1.6;}
.vacio .tit{font-family:var(--serif);font-size:19px;color:var(--tinta-2);margin-bottom:7px;font-weight:700;}
.pista{
  font-size:11.5px;color:var(--tinta-3);background:var(--papel);border:1px solid var(--linea);
  border-radius:8px;padding:10px 13px;margin-top:20px;line-height:1.55;
}
.pista code{font-family:ui-monospace,Menlo,monospace;background:var(--papel-2);
  padding:1px 4px;border-radius:3px;font-size:.92em;}
.barra-sup{
  display:flex;align-items:baseline;gap:10px;padding:22px 0 4px;flex-wrap:wrap;
}
.barra-sup h2{font-size:18px;font-weight:700;}
.barra-sup .c{font-size:12.5px;color:var(--tinta-3);}

/* ───────── personas ───────── */
.tabla-gente{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:18px;
  background:var(--papel);border:1px solid var(--linea);border-radius:12px;overflow:hidden;}
.tabla-gente th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-3);font-weight:600;padding:11px 14px;background:var(--papel-2);
  border-bottom:1px solid var(--linea);
}
.tabla-gente td{padding:10px 14px;border-bottom:1px solid var(--linea-suave);vertical-align:middle;}
.tabla-gente tr:last-child td{border-bottom:0;}
.tabla-gente .nm{display:flex;align-items:center;gap:9px;font-weight:500;}
.tabla-gente .nm .av{width:26px;height:26px;border-radius:7px;font-size:10px;margin:0;}

<script src="datos.js"></script>
<script>
const A = window.ARCHIVO;
const $ = s => document.querySelector(s);
const cuerpo = $('#cuerpo');

/* ── tema ── */
const T = (()=>{ try{ return localStorage.getItem('iam-tema'); }catch(e){ return null; } })();
if (T) document.documentElement.dataset.theme = T;
$('#btn-tema').onclick = () => {
  const oscuro = matchMedia('(prefers-color-scheme:dark)').matches;
  const ahora = document.documentElement.dataset.theme || (oscuro ? 'dark' : 'light');
  const nuevo = ahora === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nuevo;
  try{ localStorage.setItem('iam-tema', nuevo); }catch(e){}
};

/* ── utilidades ── */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sinTilde = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
               'septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fechaLarga(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const f = new Date(Date.UTC(y, m-1, d));
  return DIAS[f.getUTCDay()] + ' ' + d + ' de ' + MESES[m-1];
}
function fechaCorta(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return d + ' ' + MESES[m-1].slice(0,3);
}

const EMOJI = {o:'⭕',red_circle:'🔴',muscle:'💪',point_right:'👉',calendar:'📅',date:'📅',
  memo:'📝',movie_camera:'🎥',raised_hands:'🙌',wave:'👋',file_folder:'📁',warning:'⚠️',
  alarm_clock:'⏰',clock1:'🕐',clock2:'🕑',clock3:'🕒',clock4:'🕓',clock5:'🕔',clock8:'🕗',
  tada:'🎉',bulb:'💡',heart:'❤️',eyes:'👀',bar_chart:'📊',chart_with_upwards_trend:'📈',
  white_check_mark:'✅',heavy_check_mark:'✔️',x:'❌',pushpin:'📌',rocket:'🚀',fire:'🔥',
  clap:'👏',pray:'🙏',handshake:'🤝',books:'📚',mag:'🔍',bell:'🔔',lock:'🔒',key:'🔑',
  sparkles:'✨',star:'⭐',trophy:'🏆',dart:'🎯',hourglass:'⏳','+1':'👍','-1':'👎',
  page_facing_up:'📄',open_file_folder:'📂',inbox_tray:'📥',outbox_tray:'📤',
  computer:'💻',iphone:'📱',email:'📧',envelope:'✉️',link:'🔗',gear:'⚙️',
  large_blue_circle:'🔵',green_circle:'🟢',yellow_circle:'🟡',orange_circle:'🟠',
  arrow_right:'➡️',ok_hand:'👌',smile:'😊',blush:'😊',thinking_face:'🤔'};
const emoji = n => EMOJI[n] || null;

/* Marcado de Slack → HTML.
   Los tokens <url|etiqueta>, <@usuario> y <#canal> se extraen ANTES de escapar,
   porque las URL de SharePoint llevan & dentro y se partían a la mitad. */
function marcar(t){
  if (!t) return '';
  const cofre = [];
  const guardar = h => '\u0000' + (cofre.push(h) - 1) + '\u0000';
  const url = u => u.replace(/&/g,'&amp;').replace(/"/g,'%22');
  const enlace = (u, e) => guardar('<a class="vin" href="'+url(u)+'" target="_blank" rel="noopener">'+esc(e)+'</a>');
  const corto = u => u.replace(/^https?:\/\//,'').replace(/^(.{58}).{4,}$/, '$1…');

  let s = String(t);
  s = s.replace(/```([\s\S]*?)```/g, (_,c) => guardar('<pre>' + esc(c.trim()) + '</pre>'));
  s = s.replace(/`([^`\n]+)`/g, (_,c) => guardar('<code>' + esc(c) + '</code>'));

  s = s.replace(/<(https?:\/\/[^>|\s]+)\|([^>]*)>/g, (_,u,e) => enlace(u, e.trim() || corto(u)));
  s = s.replace(/<(https?:\/\/[^>|\s]+)>/g, (_,u) => enlace(u, corto(u)));
  s = s.replace(/<mailto:([^>|\s]+)(?:\|[^>]*)?>/g,
      (_,m) => guardar('<a href="mailto:'+esc(m)+'">'+esc(m)+'</a>'));
  s = s.replace(/<@[A-Z0-9]+\|([^>]+)>/g, (_,n) => guardar('<span class="men">@'+esc(n)+'</span>'));
  s = s.replace(/<@([A-Z0-9]+)>/g,        (_,n) => guardar('<span class="men">@'+esc(n)+'</span>'));
  s = s.replace(/<#[A-Z0-9]+\|([^>]+)>/g, (_,n) => guardar('<span class="men">#'+esc(n)+'</span>'));
  s = s.replace(/<!([a-z]+)(?:\|[^>]*)?>/g, (_,n) => guardar('<span class="men">@'+esc(n)+'</span>'));
  // una URL suelta, sin los signos de Slack
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>]+)/g, (m,a,u) => a + enlace(u, corto(u)));

  s = esc(s);
  s = s.replace(/:([a-z0-9_+\-]+):/g, (m,n) => emoji(n) || m);
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<strong>$2</strong>');
  s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/(^|[\s(])~([^~\n]+)~/g, '$1<del>$2</del>');

  const partes = s.split(/\n/);
  let salida = '', buf = [];
  const cerrar = () => { if (buf.length){ salida += '<p>' + buf.join('<br>') + '</p>'; buf = []; } };
  for (const ln of partes){
    const l = ln.trim();
    if (!l){ cerrar(); continue; }
    if (l.startsWith('&gt;')){ cerrar(); salida += '<blockquote>' + l.slice(4).trim() + '</blockquote>'; continue; }
    if (/^[•·]\s/.test(l) || /^[-–]\s/.test(l)){ buf.push('<span class="bala">• ' + l.replace(/^[•·\-–]\s*/,'') + '</span>'); continue; }
    buf.push(l);
  }
  cerrar();
  return salida.replace(/\u0000(\d+)\u0000/g, (_,i) => cofre[+i]);
}

function textoPlano(t){
  return String(t||'')
    .replace(/&lt;/g,'<')
    .replace(/<(https?:\/\/[^|>\s]+)\|([^>]*)>/g,'$2')
    .replace(/<(https?:\/\/[^|>\s]+)>/g,'$1')
    .replace(/<@[A-Z0-9]+\|([^>]+)>/g,'@$1')
    .replace(/<#[A-Z0-9]+\|([^>]+)>/g,'#$1')
    .replace(/:([a-z0-9_+\-]+):/g,' ')
    .replace(/[*_~`]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}

/* Avatar: iniciales + color estable derivado del nombre */
const PALETA = ['#B71C1C','#BF360C','#8D6E00','#00695C','#1565C0','#4527A0',
                '#AD1457','#37474F','#5D4037','#00838F','#2E7D32','#6A1B9A'];
function iniciales(n){
  const p = String(n||'?').trim().split(/\s+/).filter(x=>/[a-zA-ZÀ-ÿ]/.test(x[0]||''));
  if (!p.length) return '?';
  return ((p[0][0]||'') + (p.length>1 ? (p[p.length-1][0]||'') : '')).toUpperCase();
}
function colorDe(n){
  let h = 0; const s = String(n||'');
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return PALETA[h % PALETA.length];
}
const av = (n, cls) => '<span class="av '+(cls||'')+'" style="background:'+colorDe(n)+'">'+esc(iniciales(n))+'</span>';

const icoArchivo = t => /pdf/.test(t) ? '📄' : /csv|sheet|excel/.test(t) ? '📊'
  : /video|mp4/.test(t) ? '🎥' : /image|png|jpe?g/.test(t) ? '🖼️' : '📎';

/* ── estado ── */
let vista = { tipo:'canal', canal:A.canales[0].canal, pestana:'mensajes', acta:null, sistema:false };
let busq = '';

/* Ruta por hash: #/juridica/actas/juridica-s9-2026-09-22.json  ·  #/personas  ·  #/buscar/agente */
function leerHash(){
  const t = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean);
  if (!t.length) return false;
  if (t[0] === 'buscar'){ busq = t.slice(1).join('/'); $('#q').value = busq;
    $('#caja-buscar').classList.add('activo'); return true; }
  if (['actas','personas','archivos'].includes(t[0]) && !canalDe(t[0])){
    vista = { ...vista, tipo:t[0], acta:null }; busq=''; return true; }
  const c = canalDe(t[0]);
  if (!c) return false;
  vista = { tipo:'canal', canal:c.canal,
            pestana:['mensajes','actas','fijados','archivos'].includes(t[1]) ? t[1] : 'mensajes',
            acta:t[2] || null, sistema:vista.sistema };
  busq = '';
  return true;
}
function escribirHash(){
  let h;
  if (busq) h = '#/buscar/' + encodeURIComponent(busq);
  else if (vista.tipo !== 'canal') h = '#/' + vista.tipo;
  else h = '#/' + vista.canal + '/' + vista.pestana + (vista.acta ? '/' + vista.acta : '');
  if (location.hash !== h){ historial = true; location.hash = h; }
}
let historial = false;
addEventListener('hashchange', () => {
  if (historial){ historial = false; return; }
  if (leerHash()) pintar(true);
});

/* ── rail ── */
function pintarRail(){
  const tot = A.canales.reduce((s,c)=>s+c.conteo,0);
  const totActas = A.canales.reduce((s,c)=>s+c.actas.length,0);
  let h = '<div class="grupo">Canales<span class="cuenta">'+A.canales.length+'</span></div>';
  for (const c of A.canales){
    const sel = !busq && vista.tipo==='canal' && vista.canal===c.canal;
    h += '<button class="item'+(sel?' sel':'')+'" data-canal="'+c.canal+'">'
       + '<span class="gato">#</span><span class="nom">'+esc(c.nombre)+'</span>'
       + '<span class="n">'+c.conteo+'</span></button>';
  }
  h += '<div class="grupo">El archivo</div>'
     + '<button class="item'+(!busq&&vista.tipo==='actas'?' sel':'')+'" data-vista="actas">'
     + '<span class="punto"></span><span class="nom">Todas las actas</span><span class="n">'+totActas+'</span></button>'
     + '<button class="item'+(!busq&&vista.tipo==='personas'?' sel':'')+'" data-vista="personas">'
     + '<span class="punto"></span><span class="nom">Personas</span><span class="n">'+A.personas.length+'</span></button>'
     + '<button class="item'+(!busq&&vista.tipo==='archivos'?' sel':'')+'" data-vista="archivos">'
     + '<span class="punto"></span><span class="nom">Archivos</span><span class="n">'
     + A.canales.reduce((s,c)=>s+c.adjuntos,0)+'</span></button>'
     + '<div class="grupo">'+tot.toLocaleString('es-CO')+' mensajes guardados</div>';
  $('#rail').innerHTML = h;
  $('#rail').querySelectorAll('[data-canal]').forEach(b => b.onclick = () => {
    vista = { tipo:'canal', canal:b.dataset.canal, pestana:'mensajes', acta:null, sistema:vista.sistema };
    busq=''; $('#q').value=''; $('#caja-buscar').classList.remove('activo');
    document.body.classList.remove('rail-abierto'); pintar();
  });
  $('#rail').querySelectorAll('[data-vista]').forEach(b => b.onclick = () => {
    vista = { tipo:b.dataset.vista, canal:vista.canal, pestana:'mensajes', acta:null, sistema:vista.sistema };
    busq=''; $('#q').value=''; $('#caja-buscar').classList.remove('activo');
    document.body.classList.remove('rail-abierto'); pintar();
  });
}

const canalDe = n => A.canales.find(c => c.canal === n);

/* ── mensajes ── */
function pintarMensajes(c){
  const ms = c.mensajes.filter(m => vista.sistema || !m.sistema);
  if (!ms.length) return vacioHTML('📭','Sin mensajes','Este canal no tiene mensajes guardados.');
  let h = '', dia = null, prev = null;
  for (const m of ms){
    if (m.fecha !== dia){
      dia = m.fecha; prev = null;
      h += '<div class="dia"><span class="linea"></span><span class="et">'+fechaLarga(m.fecha)+'</span><span class="linea"></span></div>';
    }
    const seguido = prev && prev.uid === m.uid && !m.sistema && !prev.sistema
                 && (parseFloat(m.ts) - parseFloat(prev.ts) < 600);
    h += '<div class="msg'+(seguido?' seguido':'')+(m.sistema?' sis':'')+'">'
       + av(m.autor)
       + '<div class="col">';
    if (!seguido){
      h += '<div class="firma"><span class="autor">'+esc(m.autor)+'</span>'
         + '<span class="hora">'+m.hora+'</span>'
         + (m.uid && m.uid[0]==='B' ? '<span class="sello">bot</span>' : '')
         + '</div>';
    }
    h += '<div class="txt">'+marcar(m.texto)+'</div>';
    for (const a of m.adjuntos){
      h += '<div class="adj"><span class="ico">'+icoArchivo(a.tipo)+'</span><div style="min-width:0">'
         + '<div class="nom">'+esc(a.nombre)+'</div>'
         + '<div class="sub">'+esc(a.peso)+' · '+esc(a.tipo)+'</div></div></div>';
    }
    if (m.hilo) h += '<div class="hilo">💬 '+m.hilo.respuestas+' '+(m.hilo.respuestas===1?'respuesta':'respuestas')+'</div>';
    if (m.reacciones.length){
      h += '<div class="reacc">' + m.reacciones.map(r =>
        '<span>'+(emoji(r.emoji)||':'+esc(r.emoji)+':')+' '+r.cuenta+'</span>').join('') + '</div>';
    }
    h += '</div></div>';
    prev = m;
  }
  return h;
}

/* ── actas ── */
function tarjetaActa(a, canal){
  const kp = (a.kpis||[]).length, tr = (a.tareas||[]).length, al = (a.alertas||[]).length;
  return '<button class="tarjeta" data-acta="'+esc(a.archivo)+'" data-canal="'+esc(canal)+'">'
    + '<div class="s"><small>Sesión</small>'+(a.sesion_num!=null?a.sesion_num:'—')+'</div>'
    + '<div class="f">'+esc(fechaCorta(a.iso))+'</div>'
    + '<div class="m">'+esc(a.area_completa || a.area || '')+'</div>'
    + '<div class="chips">'
    + (a.prevista ? '<span class="chip m">prevista</span>' : '')
    + (kp ? '<span class="chip r">'+kp+' KPI</span>' : '')
    + (tr ? '<span class="chip">'+tr+' tareas</span>' : '')
    + (al ? '<span class="chip">'+al+' alertas</span>' : '')
    + '</div></button>';
}

function nivelClase(t){
  const s = sinTilde(t);
  if (/critic/.test(s)) return '';
  if (/^alta?$/.test(s) || /\balto\b/.test(s) || /\balta\b/.test(s)) return ' a';
  if (/\bmedi[ao]\b/.test(s)) return ' m';
  return '';
}

/* Las actas vienen en Markdown (**negrita**), no en marcado de Slack */
function marcarMd(t){
  if (!t) return '';
  const cofre = [];
  const guardar = h => '\u0000' + (cofre.push(h) - 1) + '\u0000';
  let s = String(t).replace(/`([^`\n]+)`/g, (_,c) => guardar('<code>' + esc(c) + '</code>'));
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (_,e,u) => guardar('<a class="vin" href="'+u+'" target="_blank" rel="noopener">'+e+'</a>'));
  s = s.replace(/(https?:\/\/[^\s<]+)/g,
      u => guardar('<a class="vin" href="'+u+'" target="_blank" rel="noopener">'+u.replace(/^https?:\/\//,'')+'</a>'));
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/:([a-z0-9_+\-]+):/g, (m,n) => emoji(n) || m);
  return s.replace(/\n/g, '<br>').replace(/\u0000(\d+)\u0000/g, (_,i) => cofre[+i]);
}

/* Saca un texto legible de cualquiera de las formas que usan las actas */
function textoDe(x){
  if (x == null) return '';
  if (typeof x === 'string') return x;
  if (Array.isArray(x)) return x.map(textoDe).join(' · ');
  const t = x.titulo || x.texto || x.tarea || x.nombre || '';
  const d = x.descripcion || x.detalle || x.objetivo || '';
  return t && d ? '**' + t + '** — ' + d : (t || d || '');
}

function pintarActa(a, canal){
  const c = canalDe(canal);
  let h = '<div class="acta"><button class="volver" data-volver="1">‹ Volver a las actas de #'+esc(c.nombre)+'</button>';
  h += '<div class="acta-cab"><div class="arr"><span class="anillo"></span>'
     + 'Acta de sesión · IAM™ Intelligence</div>'
     + '<h2>'+esc(a.area_completa || a.area || c.nombre)
     + (a.sesion_num!=null ? ' · Sesión '+a.sesion_num : '') + '</h2>'
     + '<div class="sub">'+esc(a.subtitulo_meta || a.fecha || a.iso)
     + (a.fase ? ' · '+esc(a.fase) : '') + '</div></div>';

  if ((a.kpis||[]).length){
    h += '<div class="kpis">' + a.kpis.map(k =>
      '<div class="kpi"><div class="v">'+esc(k.valor!=null?k.valor:'')+'</div>'
      + '<div class="e">'+esc(k.etiqueta||'')+'</div>'
      + (k.detalle ? '<div class="e" style="text-transform:none;letter-spacing:0;font-size:11px;opacity:.85;margin-top:4px">'+esc(k.detalle)+'</div>' : '')
      + '</div>').join('') + '</div>';
  }

  if ((a.datos_sesion||[]).length){
    h += '<div class="bloque"><h3>Datos de la sesión</h3><table class="tareas">'
       + a.datos_sesion.map(d => {
           const par = Array.isArray(d) ? d : [d.campo, d.valor];
           return '<tr><td class="q">'+esc(par[0])+'</td><td>'+marcarMd(String(par[1]==null?'':par[1]))+'</td></tr>';
         }).join('') + '</table></div>';
  }

  if ((a.participantes||[]).length){
    h += '<div class="bloque"><h3>Participantes<span style="float:right;font-weight:400;letter-spacing:0;text-transform:none;color:var(--tinta-3)">'
       + a.participantes.length + '</span></h3><div class="gente">'
       + a.participantes.map(p => {
           const n = typeof p === 'string' ? p : (p.nombre || '');
           const falto = typeof p === 'object' && (p.asistio === false || /^no$/i.test(String(p.asistencia||'')));
           const cargo = typeof p === 'object' ? (p.cargo || '') : '';
           return '<span class="persona'+(falto?' no':'')+'" title="'+esc(cargo)+'">'+av(n)+esc(n)
                + (cargo ? ' <span style="color:var(--tinta-3);font-size:11.5px">· '+esc(cargo.replace(/\s*\(.*\)$/,''))+'</span>' : '')
                + '</span>';
         }).join('') + '</div></div>';
  }

  // alertas y riesgos: tarjeta con nivel, título y descripción
  for (const [clave, tit] of [['alertas','Alertas'],['riesgos','Riesgos']]){
    const v = a[clave];
    if (!v || !v.length) continue;
    h += '<div class="bloque"><h3>'+tit+'</h3>' + v.map(x => {
      if (typeof x === 'string') return '<div class="alerta">'+marcarMd(x)+'</div>';
      const niv = x.nivel || x.severidad || '';
      return '<div class="alerta'+nivelClase(niv)+'">'
        + '<div style="font-weight:600;margin-bottom:'+(x.descripcion?'5px':'0')+'">'
        + (x.num ? '<span style="opacity:.6;font-variant-numeric:tabular-nums">'+esc(x.num)+'</span> ' : '')
        + (niv ? '<span style="font-size:10.5px;letter-spacing:.06em">'+esc(String(niv).toUpperCase())+'</span> · ' : '')
        + marcarMd(x.titulo || '') + '</div>'
        + (x.descripcion ? '<div>'+marcarMd(x.descripcion)+'</div>' : '') + '</div>';
    }).join('') + '</div>';
  }

  // ejercicios: título, duración, objetivo y pasos
  if ((a.ejercicios||[]).length){
    h += '<div class="bloque"><h3>Ejercicios</h3>' + a.ejercicios.map(e => {
      if (typeof e === 'string') return '<p>'+marcarMd(e)+'</p>';
      let b = '<div style="margin-bottom:17px">'
        + '<div style="font-weight:600;font-size:14.5px">'+marcarMd(e.titulo||'')+'</div>';
      const meta = [e.duracion, e.modalidad].filter(Boolean).join(' · ');
      if (meta) b += '<div style="font-size:11.5px;color:var(--tinta-3);margin-top:2px">'+esc(meta)+'</div>';
      if (e.objetivo) b += '<div style="color:var(--tinta-2);margin-top:6px;font-size:13.5px">'+marcarMd(e.objetivo)+'</div>';
      if ((e.pasos||[]).length) b += '<ul style="margin-top:8px">'+e.pasos.map(x=>'<li>'+marcarMd(textoDe(x))+'</li>').join('')+'</ul>';
      if (e.resultado) b += '<div style="margin-top:8px;padding:9px 12px;background:var(--verde-suave);border-radius:8px;font-size:13.5px">'+marcarMd(e.resultado)+'</div>';
      return b + '</div>';
    }).join('') + '</div>';
  }

  // oportunidades: bloque destacado
  if ((a.oportunidades||[]).length){
    h += '<div class="bloque"><h3>Lo que hay que subrayar</h3>' + a.oportunidades.map(o => {
      if (typeof o === 'string') return '<p>'+marcarMd(o)+'</p>';
      let b = '<div style="margin-bottom:16px;padding:14px 16px;background:var(--papel-2);border-left:3px solid var(--rojo);border-radius:0 9px 9px 0">';
      if (o.encabezado) b += '<div style="font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--rojo);font-weight:600;margin-bottom:6px">'+esc(o.encabezado)+'</div>';
      if (o.titulo) b += '<div style="font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.28;margin-bottom:6px">'+marcarMd(o.titulo)+'</div>';
      if (o.descripcion) b += '<div style="font-size:13.5px;line-height:1.58">'+marcarMd(o.descripcion)+'</div>';
      if ((o.barras||[]).length) b += '<ul style="margin-top:9px">'+o.barras.map(x=>'<li>'+marcarMd(textoDe(x))+'</li>').join('')+'</ul>';
      return b + '</div>';
    }).join('') + '</div>';
  }

  // tareas
  if ((a.tareas||[]).length){
    h += '<div class="bloque"><h3>Tareas</h3>'
       + (a.tareas_intro ? '<div style="margin-bottom:14px;color:var(--tinta-2);font-size:13.5px">'+marcarMd(a.tareas_intro)+'</div>' : '')
       + '<table class="tareas"><tr><th>Responsable</th><th>Tarea</th><th>Prioridad</th><th>Plazo</th></tr>'
       + a.tareas.map(t => typeof t === 'string'
           ? '<tr><td colspan="4">'+marcarMd(t)+'</td></tr>'
           : '<tr><td class="q">'+esc(t.responsable||'—')+'</td>'
             + '<td>'+marcarMd(t.tarea||'')+'</td>'
             + '<td><span class="chip'+nivelClase(t.prioridad||'').trim().replace('a','r')+'">'+esc(t.prioridad||'—')+'</span></td>'
             + '<td class="q" style="color:var(--tinta-3)">'+esc(t.plazo||'')+'</td></tr>'
         ).join('') + '</table></div>';
  }

  // observaciones
  if ((a.observaciones||[]).length){
    h += '<div class="bloque"><h3>Observaciones</h3><ul>'
       + a.observaciones.map(x => '<li>'+marcarMd(textoDe(x))+'</li>').join('') + '</ul></div>';
  }

  // próxima sesión
  if (a.proxima_sesion){
    const p = a.proxima_sesion;
    h += '<div class="bloque"><h3>Próxima sesión</h3>';
    if (p.sesion || p.fecha || p.hora)
      h += '<p style="margin:0 0 12px;font-weight:600;font-size:14.5px">'
         + marcarMd([p.sesion, p.fecha, p.hora].filter(Boolean).join(' · ')) + '</p>';
    if ((p.condiciones||[]).length)
      h += '<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);font-weight:600;margin-bottom:7px">Condiciones de entrada</div>'
         + '<ul>'+p.condiciones.map(x=>'<li>'+marcarMd(textoDe(x))+'</li>').join('')+'</ul>';
    if ((p.agenda||[]).length)
      h += '<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);font-weight:600;margin:15px 0 7px">Agenda</div>'
         + '<ul>'+p.agenda.map(x=>'<li>'+marcarMd(textoDe(x))+'</li>').join('')+'</ul>';
    if (p.nota) h += '<p style="margin:12px 0 0;color:var(--tinta-2)">'+marcarMd(p.nota)+'</p>';
    h += '</div>';
  }

  h += '<div class="bloque"><h3>De dónde sale esta acta</h3>'
     + '<p style="margin:0;font-size:13.5px;color:var(--tinta-2)">El PDF se publicó en <b>#'
     + esc(c.canal)+'</b> y vive en la carpeta del área. Aquí queda su contenido, que es lo que no caduca. '
     + 'Archivo fuente: <code>'+esc(a.archivo)+'</code></p></div></div>';
  return h;
}

/* ── fijados ── */
function pintarFijados(c){
  let h = '';
  const carpetas = (c.fijados||[]).slice();
  if (A.generales && A.generales.length){
    carpetas.push({ titulo:'Del programa', icono:'⭕', enlaces:A.generales });
  }
  if (!carpetas.length){
    return vacioHTML('📁','Todavía no hay nada fijado',
      'Aquí van las carpetas con los enlaces que tienes fijados arriba en Slack: el de agenda, el tablero del área, lo que quieras.')
      + '<div class="pista" style="max-width:600px;margin:0 auto">Se llenan editando <code>fijados.json</code> '
      + 'y corriendo <code>python3 construir.py</code>. Cada canal lleva sus carpetas, y cada carpeta sus enlaces con título y nota.</div>';
  }
  for (const f of carpetas){
    h += '<div class="carpeta"><h3><span>'+(f.icono||'📁')+'</span>'+esc(f.titulo||'Carpeta')
       + '<span class="n">'+(f.enlaces||[]).length+'</span></h3>';
    h += (f.enlaces||[]).map(e =>
      '<a class="enlace" href="'+esc(e.url)+'" target="_blank" rel="noopener">'
      + '<span class="ico">🔗</span><div style="min-width:0"><div class="t">'+esc(e.titulo||e.url)+'</div>'
      + '<div class="u">'+esc(e.nota || String(e.url).replace(/^https?:\/\//,''))+'</div></div>'
      + '<span class="fl">↗</span></a>').join('');
    h += '</div>';
  }
  return h;
}

/* ── archivos ── */
function pintarArchivos(c){
  const filas = [];
  const canales = c ? [c] : A.canales;
  for (const ca of canales)
    for (const m of ca.mensajes)
      for (const a of m.adjuntos)
        filas.push({ ...a, canal:ca, fecha:m.fecha, autor:m.autor });
  filas.sort((x,y) => y.fecha.localeCompare(x.fecha));
  if (!filas.length) return vacioHTML('📎','Sin archivos','No hay adjuntos guardados aquí.');
  let h = '<table class="tabla-gente"><tr><th>Archivo</th>'+(c?'':'<th>Canal</th>')+'<th>Fecha</th><th>Peso</th></tr>';
  for (const f of filas){
    h += '<tr><td><div class="nm"><span style="font-size:16px">'+icoArchivo(f.tipo)+'</span>'
       + '<span style="overflow:hidden;text-overflow:ellipsis">'+esc(f.nombre)+'</span></div></td>'
       + (c?'':'<td class="cn">#'+esc(f.canal.nombre)+'</td>')
       + '<td class="co">'+fechaCorta(f.fecha)+'</td><td class="co">'+esc(f.peso)+'</td></tr>';
  }
  return h + '</table><div class="pista">Slack en plan gratuito conserva el <b>nombre</b> del archivo, '
    + 'no el archivo. Los PDF y las grabaciones viven en SharePoint y en la carpeta del área; '
    + 'este índice dice qué se publicó, cuándo y en qué canal.</div>';
}

/* ── personas ── */
function pintarPersonas(){
  let h = '<table class="tabla-gente"><tr><th>Persona</th><th>Correo</th>'
        + '<th style="text-align:right">Mensajes</th><th>Canales</th></tr>';
  for (const p of A.personas){
    if (!p.mensajes) continue;
    h += '<tr><td><div class="nm">'+av(p.nombre)+esc(p.nombre)+'</div></td>'
       + '<td class="co">'+esc(p.correo||'—')+'</td>'
       + '<td class="num">'+p.mensajes+'</td>'
       + '<td class="cn">'+p.canales.length+'</td></tr>';
  }
  return h + '</table>';
}

/* ── búsqueda ── */
function resaltar(t, q){
  const plano = textoPlano(t);
  const i = sinTilde(plano).indexOf(sinTilde(q));
  if (i < 0) return esc(plano.slice(0, 190)) + (plano.length > 190 ? '…' : '');
  const ini = Math.max(0, i - 70);
  const rec = plano.slice(ini, i + q.length + 130);
  const j = sinTilde(rec).indexOf(sinTilde(q));
  return (ini ? '…' : '') + esc(rec.slice(0,j)) + '<mark>' + esc(rec.slice(j, j+q.length))
       + '</mark>' + esc(rec.slice(j+q.length)) + (ini + rec.length < plano.length ? '…' : '');
}

function pintarBusqueda(q){
  const nq = sinTilde(q);
  const hits = [];
  for (const c of A.canales){
    for (const m of c.mensajes){
      if (m.sistema) continue;
      if (sinTilde(textoPlano(m.texto)).includes(nq) || sinTilde(m.autor).includes(nq)
          || m.adjuntos.some(a => sinTilde(a.nombre).includes(nq))){
        hits.push({ c, m });
      }
    }
  }
  hits.sort((x,y) => y.m.ts.localeCompare(x.m.ts));
  let h = '<div class="barra-sup"><h2>'+hits.length.toLocaleString('es-CO')
        + (hits.length===1?' mensaje':' mensajes')+'</h2><span class="c">con «'+esc(q)+'»</span></div>';
  if (!hits.length){
    return h + vacioHTML('⌕','Nada por aquí','No aparece en ninguno de los '
      + A.canales.length + ' canales. Prueba con una palabra más corta.');
  }
  h += '<div style="padding-top:14px">';
  for (const {c,m} of hits.slice(0,400)){
    h += '<button class="res" data-ir="'+esc(c.canal)+'">'
       + '<div class="arr"><span class="ca">#'+esc(c.nombre)+'</span>'
       + '<span class="au">'+esc(m.autor)+'</span>'
       + '<span class="fe">'+fechaCorta(m.fecha)+' · '+m.hora+'</span></div>'
       + '<div class="ex">'+resaltar(m.texto, q)+'</div>'
       + (m.adjuntos.length ? '<div class="ex" style="margin-top:6px;color:var(--rojo)">📎 '
          + m.adjuntos.map(a=>esc(a.nombre)).join(' · ')+'</div>' : '')
       + '</button>';
  }
  h += '</div>';
  if (hits.length > 400) h += '<div class="pista">Se muestran los primeros 400 de '+hits.length+'.</div>';
  return h;
}

function vacioHTML(ico, tit, txt){
  return '<div class="vacio"><div class="gran">'+ico+'</div><div class="tit">'+esc(tit)+'</div><p>'+esc(txt)+'</p></div>';
}

/* ── pintado ── */
function pintar(saltarHash){
  if (!saltarHash) escribirHash();
  pintarRail();
  let h = '', tit = '', meta = '', pest = '';

  if (busq){
    tit = '<span class="gato">⌕</span>Búsqueda';
    meta = 'En los '+A.canales.length+' canales y '
         + A.canales.reduce((s,c)=>s+c.conteo,0).toLocaleString('es-CO')+' mensajes del archivo';
    h = '<div class="lienzo">' + pintarBusqueda(busq) + '</div>';
  }
  else if (vista.tipo === 'canal'){
    const c = canalDe(vista.canal);
    tit = '<span class="gato">#</span>'+esc(c.nombre);
    meta = '<b>'+c.conteo+'</b> mensajes<span class="sep">·</span><b>'+c.actas.length+'</b> actas'
         + '<span class="sep">·</span><b>'+c.adjuntos+'</b> archivos'
         + '<span class="sep">·</span>'+fechaCorta(c.desde)+' – '+fechaCorta(c.hasta)
         + '<span class="sep">·</span>canal privado';
    const p = [['mensajes','Mensajes',c.conteo],['actas','Actas',c.actas.length],
               ['fijados','Fijados',(c.fijados||[]).length + (A.generales||[]).length],
               ['archivos','Archivos',c.adjuntos]];
    pest = p.map(([k,l,n]) => '<button class="'+(vista.pestana===k&&!vista.acta?'sel':'')
      + '" data-p="'+k+'">'+l+(n?'<span class="n">'+n+'</span>':'')+'</button>').join('');

    if (vista.acta){
      const a = c.actas.find(x => x.archivo === vista.acta);
      h = '<div class="lienzo">' + (a ? pintarActa(a, c.canal) : vacioHTML('📄','Acta no encontrada','')) + '</div>';
    } else if (vista.pestana === 'mensajes'){
      h = '<div class="lienzo">' + pintarMensajes(c)
        + '<div class="pista">Mostrando los mensajes del equipo. '
        + '<button id="alt-sis" style="color:var(--rojo);font-weight:500;text-decoration:underline">'
        + (vista.sistema ? 'Ocultar' : 'Ver') + ' los '
        + (c.conteo_total - c.conteo) + ' avisos del sistema</button> (entradas y salidas del canal).</div></div>';
    } else if (vista.pestana === 'actas'){
      h = '<div class="lienzo">' + (c.actas.length
        ? '<div class="rejilla">' + c.actas.map(a => tarjetaActa(a, c.canal)).join('') + '</div>'
        : vacioHTML('📄','Sin actas','Este canal no tiene actas registradas.')) + '</div>';
    } else if (vista.pestana === 'fijados'){
      h = '<div class="lienzo">' + pintarFijados(c) + '</div>';
    } else {
      h = '<div class="lienzo">' + pintarArchivos(c) + '</div>';
    }
  }
  else if (vista.tipo === 'actas'){
    const todas = [];
    for (const c of A.canales) for (const a of c.actas) todas.push({a, c});
    todas.sort((x,y) => y.a.iso.localeCompare(x.a.iso));
    tit = 'Todas las actas';
    meta = '<b>'+todas.length+'</b> sesiones documentadas<span class="sep">·</span>'
         + 'de la más reciente a la primera';
    h = '<div class="lienzo"><div class="rejilla">'
      + todas.map(({a,c}) => tarjetaActa(a, c.canal).replace(
          '<div class="m">', '<div class="m">#'+esc(c.nombre)+' · ')).join('')
      + '</div></div>';
  }
  else if (vista.tipo === 'personas'){
    tit = 'Personas';
    meta = '<b>'+A.personas.filter(p=>p.mensajes).length+'</b> personas escribieron en el archivo';
    h = '<div class="lienzo">' + pintarPersonas() + '</div>';
  }
  else {
    tit = 'Archivos';
    meta = '<b>'+A.canales.reduce((s,c)=>s+c.adjuntos,0)+'</b> adjuntos publicados en los canales';
    h = '<div class="lienzo">' + pintarArchivos(null) + '</div>';
  }

  $('#titulo').innerHTML = tit;
  $('#meta').innerHTML = meta;
  $('#pestanas').innerHTML = pest;
  cuerpo.innerHTML = h + pie();
  cuerpo.scrollTop = 0;

  $('#pestanas').querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    vista.pestana = b.dataset.p; vista.acta = null; pintar();
  });
  cuerpo.querySelectorAll('[data-acta]').forEach(b => b.onclick = () => {
    vista = { tipo:'canal', canal:b.dataset.canal, pestana:'actas', acta:b.dataset.acta, sistema:vista.sistema };
    busq=''; $('#q').value=''; $('#caja-buscar').classList.remove('activo'); pintar();
  });
  cuerpo.querySelectorAll('[data-volver]').forEach(b => b.onclick = () => { vista.acta = null; pintar(); });
  cuerpo.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    vista = { tipo:'canal', canal:b.dataset.ir, pestana:'mensajes', acta:null, sistema:vista.sistema };
    busq=''; $('#q').value=''; $('#caja-buscar').classList.remove('activo'); pintar();
  });
  const alt = $('#alt-sis');
  if (alt) alt.onclick = () => { vista.sistema = !vista.sistema; pintar(); };
}

function pie(){
  return '<footer><span class="anillo"></span>'
    + '<span><b>IAM™ Intelligence</b> · Archivo de Comfacesar · Sandra Curvelo, Mentora IAM™</span>'
    + '<span class="d">'+A.canales.length+' canales · '
    + A.canales.reduce((s,c)=>s+c.conteo,0).toLocaleString('es-CO')+' mensajes · '
    + A.canales.reduce((s,c)=>s+c.actas.length,0)+' actas · 4 ago – 30 sep 2026</span></footer>';
}

/* ── buscador ── */
let reloj;
$('#q').addEventListener('input', e => {
  const v = e.target.value.trim();
  $('#caja-buscar').classList.toggle('activo', !!v);
  clearTimeout(reloj);
  reloj = setTimeout(() => { busq = v.length >= 2 ? v : ''; pintar(); }, 130);
});
$('#btn-limpiar').onclick = () => {
  $('#q').value = ''; busq = ''; $('#caja-buscar').classList.remove('activo'); pintar(); $('#q').focus();
};
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape'){
    if ($('#q').value){ $('#btn-limpiar').click(); }
    else document.body.classList.remove('rail-abierto');
  }
});

leerHash();
pintar(true);
</script>
</body>
