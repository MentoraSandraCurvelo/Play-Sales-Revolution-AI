<title>Archivo IAM Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
/* Chrome de aplicación macOS: barra lateral traslúcida + panel con título grande
   que se condensa al desplazar. Rojo IAM solo como acento, nunca de fondo. */
:root{
  --rojo:#C00000;
  --rojo-tenue:rgba(192,0,0,.09);
  --rojo-borde:rgba(192,0,0,.24);
  --rojo-sombra:rgba(192,0,0,.22);

  --lienzo:#F5F5F7;
  --panel:#FFFFFF;
  --panel-2:#FAFAFC;
  --material:rgba(248,248,250,.76);
  --material-2:rgba(255,255,255,.82);

  --tinta:#1D1D1F;
  --tinta-2:#515154;
  --tinta-3:#86868B;
  --linea:rgba(0,0,0,.09);
  --linea-suave:rgba(0,0,0,.055);
  --realce:rgba(0,0,0,.045);
  --realce-2:rgba(0,0,0,.08);

  --s1:0 .5px 1px rgba(0,0,0,.05);
  --s2:0 2px 8px rgba(0,0,0,.055),0 .5px 2px rgba(0,0,0,.05);
  --s3:0 12px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --s4:0 32px 90px rgba(0,0,0,.26),0 4px 14px rgba(0,0,0,.1);

  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
  --muelle:cubic-bezier(.32,.72,0,1);
  --rail:268px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --rojo:#FF453A;
    --rojo-tenue:rgba(255,69,58,.13);
    --rojo-borde:rgba(255,69,58,.3);
    --rojo-sombra:rgba(255,69,58,.26);
    --lienzo:#000000;
    --panel:#1C1C1E;
    --panel-2:#242426;
    --material:rgba(24,24,26,.76);
    --material-2:rgba(32,32,34,.84);
    --tinta:#F5F5F7;
    --tinta-2:#AEAEB2;
    --tinta-3:#8E8E93;
    --linea:rgba(255,255,255,.11);
    --linea-suave:rgba(255,255,255,.065);
    --realce:rgba(255,255,255,.06);
    --realce-2:rgba(255,255,255,.1);
    --s1:0 .5px 1px rgba(0,0,0,.4);
    --s2:0 2px 8px rgba(0,0,0,.4),0 .5px 2px rgba(0,0,0,.3);
    --s3:0 12px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
    --s4:0 32px 90px rgba(0,0,0,.75),0 4px 14px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --rojo:#FF453A;
  --rojo-tenue:rgba(255,69,58,.13);
  --rojo-borde:rgba(255,69,58,.3);
  --rojo-sombra:rgba(255,69,58,.26);
  --lienzo:#000000;
  --panel:#1C1C1E;
  --panel-2:#242426;
  --material:rgba(24,24,26,.76);
  --material-2:rgba(32,32,34,.84);
  --tinta:#F5F5F7;
  --tinta-2:#AEAEB2;
  --tinta-3:#8E8E93;
  --linea:rgba(255,255,255,.11);
  --linea-suave:rgba(255,255,255,.065);
  --realce:rgba(255,255,255,.06);
  --realce-2:rgba(255,255,255,.1);
  --s1:0 .5px 1px rgba(0,0,0,.4);
  --s2:0 2px 8px rgba(0,0,0,.4),0 .5px 2px rgba(0,0,0,.3);
  --s3:0 12px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
  --s4:0 32px 90px rgba(0,0,0,.75),0 4px 14px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--lienzo);color:var(--tinta);
  font-family:var(--ui);font-size:15px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em;text-wrap:balance;}
a{color:var(--rojo);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
:focus-visible{outline:2.5px solid var(--rojo);outline-offset:2px;border-radius:7px;}
::selection{background:var(--rojo-tenue);}
.num{font-variant-numeric:tabular-nums;}

/* ══════════ armazón ══════════ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100%;}

/* ══════════ barra lateral ══════════ */
.rail{
  display:flex;flex-direction:column;min-height:0;
  background:var(--material);backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-right:.5px solid var(--linea);
}
.marca{
  display:flex;align-items:center;gap:10px;flex:none;
  padding:16px 14px 12px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
}
.anillo{
  width:14px;height:14px;border-radius:50%;flex:none;
  border:3.2px solid var(--rojo);box-shadow:0 0 0 .5px var(--rojo-tenue);
}
.marca .t{font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;}
.marca .s{
  display:block;font-size:10.5px;font-weight:500;letter-spacing:.055em;
  text-transform:uppercase;color:var(--tinta-3);margin-top:2px;
}
.icono-btn{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  color:var(--tinta-3);transition:background .15s,color .15s;flex:none;
}
.icono-btn:hover{background:var(--realce);color:var(--tinta);}
.marca .icono-btn{margin-left:auto;}

.abrir-paleta{
  display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:7px 9px;
  border-radius:9px;background:var(--realce);color:var(--tinta-3);
  font-size:13px;width:calc(100% - 24px);flex:none;
  transition:background .15s,box-shadow .15s;
}
.abrir-paleta:hover{background:var(--realce-2);}
.abrir-paleta .k{
  margin-left:auto;font-size:11px;font-weight:500;padding:1.5px 5px;border-radius:5px;
  background:var(--panel);box-shadow:var(--s1);color:var(--tinta-3);letter-spacing:.02em;
}

.rail-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 16px;scrollbar-width:thin;}
.rail-scroll::-webkit-scrollbar{width:7px;}
.rail-scroll::-webkit-scrollbar-thumb{background:var(--realce-2);border-radius:4px;}
.rail-scroll::-webkit-scrollbar-track{background:transparent;}
.grupo{
  padding:14px 10px 5px;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tinta-3);display:flex;align-items:center;
}
.grupo .c{margin-left:auto;font-weight:500;letter-spacing:.02em;opacity:.8;}
.item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 10px;border-radius:8px;font-size:13.5px;font-weight:450;
  color:var(--tinta-2);transition:background .14s,color .14s;line-height:1.35;
}
.item:hover{background:var(--realce);color:var(--tinta);}
.item.sel{background:var(--rojo);color:#fff;font-weight:550;box-shadow:0 1px 3px var(--rojo-sombra);}
.item .g{opacity:.45;font-weight:400;flex:none;}
.item.sel .g{opacity:.72;}
.item .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.item .n{font-size:11.5px;color:var(--tinta-3);flex:none;font-variant-numeric:tabular-nums;}
.item.sel .n{color:rgba(255,255,255,.82);}
.item .ic{width:17px;text-align:center;flex:none;opacity:.75;}
.item.sel .ic{opacity:1;}
.rail-pie{
  flex:none;padding:10px 18px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:.5px solid var(--linea);font-size:11px;color:var(--tinta-3);line-height:1.5;
}

/* ══════════ panel ══════════ */
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;}
.barra{
  position:sticky;top:0;z-index:20;flex:none;height:52px;
  display:flex;align-items:center;gap:10px;padding:0 24px;
  background:var(--material-2);backdrop-filter:saturate(180%) blur(30px);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  border-bottom:.5px solid transparent;transition:border-color .25s;
  padding-top:env(safe-area-inset-top,0px);
}
.barra.pegada{border-bottom-color:var(--linea);}
.barra .compacto{
  font-size:14.5px;font-weight:600;opacity:0;transform:translateY(7px);
  transition:opacity .25s var(--muelle),transform .25s var(--muelle);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.barra.pegada .compacto{opacity:1;transform:none;}
.barra .der{margin-left:auto;display:flex;gap:4px;align-items:center;}
.menu-btn{display:none;}

.cuerpo{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;}
.cuerpo::-webkit-scrollbar{width:12px;}
.cuerpo::-webkit-scrollbar-thumb{background:var(--realce-2);border-radius:7px;border:3.5px solid transparent;background-clip:content-box;}
.cuerpo::-webkit-scrollbar-track{background:transparent;}
.lienzo{max-width:880px;margin:0 auto;padding:0 24px 80px;min-width:0;}

/* título grande */
.titulon{padding:6px 0 0;}
.titulon .cejilla{
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--rojo);margin-bottom:7px;display:flex;align-items:center;gap:7px;
}
.titulon .cejilla .anillo{width:8px;height:8px;border-width:2px;box-shadow:none;}
.titulon h1{font-size:34px;line-height:1.1;letter-spacing:-.028em;display:flex;align-items:baseline;gap:9px;}
.titulon h1 .g{color:var(--tinta-3);font-weight:400;font-size:28px;}
.titulon .meta{
  font-size:13px;color:var(--tinta-3);margin-top:7px;line-height:1.55;
  display:flex;flex-wrap:wrap;align-items:center;gap:0 7px;
}
.titulon .meta b{font-weight:550;color:var(--tinta-2);font-variant-numeric:tabular-nums;}
.titulon .meta i{font-style:normal;opacity:.4;}
.candado{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:550;
  padding:1.5px 7px;border-radius:20px;background:var(--realce);color:var(--tinta-3);
}

/* control segmentado al estilo del sistema */
.segmentos{
  display:inline-flex;gap:2px;margin:18px 0 0;padding:2px;border-radius:10px;
  background:var(--realce);position:relative;max-width:100%;overflow-x:auto;
  scrollbar-width:none;
}
.segmentos::-webkit-scrollbar{display:none;}
.segmentos button{
  position:relative;z-index:1;padding:5px 14px;border-radius:8px;font-size:13px;
  font-weight:500;color:var(--tinta-2);white-space:nowrap;
  transition:color .2s,background .22s var(--muelle),box-shadow .22s var(--muelle);
}
.segmentos button:hover{color:var(--tinta);}
.segmentos button.sel{
  background:var(--panel);color:var(--tinta);font-weight:600;box-shadow:var(--s1),0 0 0 .5px var(--linea-suave);
}
.segmentos button .n{
  font-size:11px;margin-left:5px;color:var(--tinta-3);font-variant-numeric:tabular-nums;
}
.segmentos button.sel .n{color:var(--rojo);}

.seccion{margin-top:34px;}
.seccion > h2{
  font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tinta-3);margin-bottom:13px;
}

/* ══════════ portada ══════════ */
.portada h1{font-size:46px;line-height:1.06;letter-spacing:-.032em;max-width:16ch;}
.portada .bajada{
  font-size:17px;color:var(--tinta-2);margin-top:14px;max-width:56ch;line-height:1.5;
  letter-spacing:-.012em;
}
.cifras{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;
  margin-top:30px;background:var(--linea-suave);border-radius:15px;overflow:hidden;
  box-shadow:0 0 0 1px var(--linea-suave);
}
.cifra{background:var(--panel);padding:16px 18px 17px;}
.cifra .v{
  font-size:29px;font-weight:600;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.cifra .e{font-size:11.5px;color:var(--tinta-3);margin-top:6px;font-weight:500;}

/* gráfico */
.grafico{
  background:var(--panel);border-radius:15px;padding:20px 22px 16px;
  box-shadow:0 0 0 1px var(--linea-suave),var(--s1);
}
.grafico .cab{display:flex;align-items:baseline;gap:10px;margin-bottom:3px;flex-wrap:wrap;}
.grafico .cab h3{font-size:15px;font-weight:600;}
.grafico .cab .sub{font-size:12.5px;color:var(--tinta-3);}
.grafico .cab .pico{margin-left:auto;font-size:12px;color:var(--tinta-3);}
.grafico .cab .pico b{color:var(--tinta);font-weight:600;font-variant-numeric:tabular-nums;}
.plot{display:flex;align-items:flex-end;gap:2px;margin-top:14px;}
.plot .col{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;position:relative;cursor:default;
}
.plot .bar{
  width:min(24px,62%);border-radius:4px 4px 0 0;background:var(--rojo);
  transition:opacity .16s,transform .3s var(--muelle);transform-origin:bottom;
}
.plot .col:hover .bar{opacity:.72;}
.plot .val{
  font-size:11.5px;font-weight:600;margin-bottom:5px;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.plot .fantasma{font-size:11.5px;margin-bottom:5px;visibility:hidden;}
.linea-base{height:1px;background:var(--linea);margin-top:0;}
.ejex{display:flex;gap:2px;margin-top:7px;}
.ejex span{
  flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--tinta-3);
  font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.globo{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-116%);
  background:var(--panel);border-radius:10px;padding:8px 11px;box-shadow:var(--s3),0 0 0 .5px var(--linea);
  font-size:12.5px;white-space:nowrap;transition:opacity .13s;line-height:1.45;
}
.globo b{font-variant-numeric:tabular-nums;}
.globo .f{color:var(--tinta-3);font-size:11px;display:block;}

/* tarjetas de canal */
.tarjetas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));}
.tcanal{
  background:var(--panel);border-radius:14px;padding:15px 16px 13px;text-align:left;width:100%;
  box-shadow:0 0 0 1px var(--linea-suave),var(--s1);
  transition:transform .26s var(--muelle),box-shadow .26s var(--muelle);
}
.tcanal:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--rojo-borde),var(--s2);}
.tcanal:active{transform:translateY(-1px) scale(.994);}
.tcanal .arr{display:flex;align-items:baseline;gap:6px;}
.tcanal .nom{font-size:14.5px;font-weight:600;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tcanal .arr .g{color:var(--tinta-3);font-weight:400;}
.tcanal .sub{font-size:12px;color:var(--tinta-3);margin-top:3px;font-variant-numeric:tabular-nums;}
.chispa{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:11px;}
.chispa i{
  flex:1;background:var(--rojo);border-radius:2px 2px 0 0;min-height:2px;
  opacity:.3;transition:opacity .26s var(--muelle);
}
.tcanal:hover .chispa i{opacity:.62;}
.chispa i.max{opacity:.78;}
.tcanal:hover .chispa i.max{opacity:1;}
.tcanal .pie{
  display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:9px;
  border-top:.5px solid var(--linea-suave);font-size:11.5px;color:var(--tinta-3);
}
.tcanal .pie .fl{margin-left:auto;opacity:0;transform:translateX(-3px);transition:all .22s var(--muelle);color:var(--rojo);}
.tcanal:hover .pie .fl{opacity:1;transform:none;}

/* ══════════ mensajes ══════════ */
.dia{
  position:sticky;top:0;z-index:5;display:flex;justify-content:center;
  padding:22px 0 12px;pointer-events:none;
}
.dia span{
  font-size:11.5px;font-weight:600;color:var(--tinta-2);
  background:var(--material-2);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:3.5px 12px;border-radius:20px;box-shadow:0 0 0 .5px var(--linea),var(--s1);
}
.msg{display:flex;gap:11px;padding:6px 11px;border-radius:10px;margin:0 -11px;transition:background .13s;}
.msg:hover{background:var(--realce);}
.msg.seg{padding-top:1px;}
.msg.seg .av{visibility:hidden;height:0;}
.av{
  width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:11.5px;font-weight:600;color:#fff;margin-top:2px;letter-spacing:-.01em;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),var(--s1);
}
.msg .col{min-width:0;flex:1;}
.msg .firma{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.msg .autor{font-weight:600;font-size:14px;letter-spacing:-.012em;}
.msg .hora{font-size:11px;color:var(--tinta-3);font-variant-numeric:tabular-nums;}
.msg .sello{
  font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  background:var(--realce);color:var(--tinta-3);padding:1px 5px;border-radius:4px;
}
.txt{font-size:14.5px;line-height:1.56;overflow-wrap:break-word;}
.txt p{margin:0 0 6px;}
.txt p:last-child{margin-bottom:0;}
.txt strong{font-weight:600;}
.txt code{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-size:.86em;
  background:var(--realce);padding:1px 5px;border-radius:5px;color:var(--rojo);
}
.txt pre{
  background:var(--panel);border-radius:10px;padding:12px 14px;overflow-x:auto;
  font-size:12.5px;margin:9px 0;box-shadow:0 0 0 1px var(--linea-suave);
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;line-height:1.5;
}
.txt blockquote{
  margin:9px 0;padding:1px 0 1px 14px;border-left:2.5px solid var(--rojo-borde);
  color:var(--tinta-2);
}
.txt .men{
  background:var(--rojo-tenue);color:var(--rojo);padding:.5px 5px;border-radius:5px;
  font-weight:550;white-space:nowrap;
}
.txt .vin{word-break:break-word;}
.txt .bala{display:block;padding-left:16px;text-indent:-16px;}
.msg.sis .txt{font-size:12.5px;color:var(--tinta-3);}
.msg.sis .av{background:none!important;box-shadow:inset 0 0 0 1px var(--linea);}

.adj{
  display:flex;align-items:center;gap:11px;margin-top:8px;padding:10px 13px;
  background:var(--panel);border-radius:11px;max-width:530px;
  box-shadow:0 0 0 1px var(--linea-suave),var(--s1);
}
.adj .ic{font-size:17px;flex:none;line-height:1;}
.adj .nm{font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.adj .sb{font-size:11px;color:var(--tinta-3);margin-top:1px;font-variant-numeric:tabular-nums;}
.hilo{
  display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:3px 11px 3px 9px;
  border-radius:20px;font-size:12px;color:var(--rojo);font-weight:550;
  background:var(--rojo-tenue);
}
.reacc{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.reacc span{
  font-size:12px;background:var(--panel);padding:2px 9px;border-radius:20px;
  box-shadow:0 0 0 1px var(--linea-suave);font-variant-numeric:tabular-nums;
}

/* ══════════ actas ══════════ */
.tacta{
  background:var(--panel);border-radius:14px;padding:16px;text-align:left;width:100%;
  box-shadow:0 0 0 1px var(--linea-suave),var(--s1);
  transition:transform .26s var(--muelle),box-shadow .26s var(--muelle);
}
.tacta:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--rojo-borde),var(--s2);}
.tacta:active{transform:translateY(-1px) scale(.994);}
.tacta .ses{
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tinta-3);
}
.tacta .n{
  font-size:32px;font-weight:600;color:var(--rojo);line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;margin-top:2px;
}
.tacta .f{font-size:13.5px;font-weight:550;margin-top:9px;}
.tacta .m{font-size:11.5px;color:var(--tinta-3);margin-top:2px;}

<script>
const A = window.ARCHIVO;
const $ = s => document.querySelector(s);
const cuerpo = $('#cuerpo'), globo = $('#globo');

/* ── tema ── */
try{ const t = localStorage.getItem('iam-tema'); if (t) document.documentElement.dataset.theme = t; }catch(e){}
$('#btn-tema').onclick = () => {
  const oscuroSis = matchMedia('(prefers-color-scheme:dark)').matches;
  const ahora = document.documentElement.dataset.theme || (oscuroSis ? 'dark' : 'light');
  const nuevo = ahora === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nuevo;
  try{ localStorage.setItem('iam-tema', nuevo); }catch(e){}
};
if (!/Mac|iPhone|iPad/.test(navigator.platform || '')) $('#tecla').textContent = 'Ctrl K';

/* ── utilidades ── */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plano = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const AYER = (() => { const h = new Date(); return [0,1].map(d => new Date(h-864e5*d).toISOString().slice(0,10)); })();
function fechaLarga(iso){
  const [y,m,d] = iso.split('-').map(Number);
  if (iso === AYER[0]) return 'hoy';
  if (iso === AYER[1]) return 'ayer';
  return DIAS[new Date(Date.UTC(y,m-1,d)).getUTCDay()] + ' ' + d + ' de ' + MESES[m-1];
}
const fechaCorta = iso => { const [,m,d] = iso.split('-').map(Number); return d + ' ' + MESES[m-1].slice(0,3); };
const miles = n => n.toLocaleString('es-CO');

const EMOJI = {o:'⭕',red_circle:'🔴',muscle:'💪',point_right:'👉',calendar:'📅',date:'📅',memo:'📝',
  movie_camera:'🎥',raised_hands:'🙌',wave:'👋',file_folder:'📁',warning:'⚠️',alarm_clock:'⏰',
  clock1:'🕐',clock2:'🕑',clock3:'🕒',clock4:'🕓',clock5:'🕔',clock8:'🕗',tada:'🎉',bulb:'💡',
  heart:'❤️',eyes:'👀',bar_chart:'📊',chart_with_upwards_trend:'📈',white_check_mark:'✅',
  heavy_check_mark:'✔️',x:'❌',pushpin:'📌',rocket:'🚀',fire:'🔥',clap:'👏',pray:'🙏',
  handshake:'🤝',books:'📚',mag:'🔍',bell:'🔔',lock:'🔒',key:'🔑',sparkles:'✨',star:'⭐',
  trophy:'🏆',dart:'🎯',hourglass:'⏳','+1':'👍','-1':'👎',page_facing_up:'📄',open_file_folder:'📂',
  inbox_tray:'📥',outbox_tray:'📤',computer:'💻',iphone:'📱',email:'📧',envelope:'✉️',link:'🔗',
  gear:'⚙️',large_blue_circle:'🔵',green_circle:'🟢',yellow_circle:'🟡',orange_circle:'🟠',
  arrow_right:'➡️',ok_hand:'👌',smile:'😊',blush:'😊',thinking_face:'🤔'};
const emo = n => EMOJI[n] || null;

/* Marcado de Slack. Los tokens <url|etiqueta> y <@usuario> se extraen antes de
   escapar: las URL de SharePoint llevan & dentro y si no se partían a la mitad. */
function marcar(t){
  if (!t) return '';
  const cofre = []; const dep = h => '\u0000'+(cofre.push(h)-1)+'\u0000';
  const u2 = u => u.replace(/&/g,'&amp;').replace(/"/g,'%22');
  const lnk = (u,e) => dep('<a class="vin" href="'+u2(u)+'" target="_blank" rel="noopener">'+esc(e)+'</a>');
  const corto = u => u.replace(/^https?:\/\//,'').replace(/^(.{56}).{4,}$/,'$1…');
  let s = String(t);
  s = s.replace(/```([\s\S]*?)```/g, (_,c) => dep('<pre>'+esc(c.trim())+'</pre>'));
  s = s.replace(/`([^`\n]+)`/g, (_,c) => dep('<code>'+esc(c)+'</code>'));
  s = s.replace(/<(https?:\/\/[^>|\s]+)\|([^>]*)>/g, (_,u,e) => lnk(u, e.trim() || corto(u)));
  s = s.replace(/<(https?:\/\/[^>|\s]+)>/g, (_,u) => lnk(u, corto(u)));
  s = s.replace(/<mailto:([^>|\s]+)(?:\|[^>]*)?>/g, (_,m) => dep('<a href="mailto:'+esc(m)+'">'+esc(m)+'</a>'));
  s = s.replace(/<@[A-Z0-9]+\|([^>]+)>/g, (_,n) => dep('<span class="men">@'+esc(n)+'</span>'));
  s = s.replace(/<@([A-Z0-9]+)>/g,        (_,n) => dep('<span class="men">@'+esc(n)+'</span>'));
  s = s.replace(/<#[A-Z0-9]+\|([^>]+)>/g, (_,n) => dep('<span class="men">#'+esc(n)+'</span>'));
  s = s.replace(/<!([a-z]+)(?:\|[^>]*)?>/g, (_,n) => dep('<span class="men">@'+esc(n)+'</span>'));
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>]+)/g, (m,a,u) => a + lnk(u, corto(u)));
  s = esc(s);
  s = s.replace(/:([a-z0-9_+\-]+):/g, (m,n) => emo(n) || m);
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<strong>$2</strong>');
  s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/(^|[\s(])~([^~\n]+)~/g, '$1<del>$2</del>');
  let out = '', buf = [];
  const cerrar = () => { if (buf.length){ out += '<p>'+buf.join('<br>')+'</p>'; buf = []; } };
  for (const ln of s.split('\n')){
    const l = ln.trim();
    if (!l){ cerrar(); continue; }
    if (l.startsWith('&gt;')){ cerrar(); out += '<blockquote>'+l.slice(4).trim()+'</blockquote>'; continue; }
    if (/^[•·\-–]\s/.test(l)){ buf.push('<span class="bala">• '+l.replace(/^[•·\-–]\s*/,'')+'</span>'); continue; }
    buf.push(l);
  }
  cerrar();
  return out.replace(/\u0000(\d+)\u0000/g, (_,i) => cofre[+i]);
}

/* Las actas vienen en Markdown, no en marcado de Slack */
function md(t){
  if (!t) return '';
  const cofre = []; const dep = h => '\u0000'+(cofre.push(h)-1)+'\u0000';
  let s = String(t).replace(/`([^`\n]+)`/g, (_,c) => dep('<code>'+esc(c)+'</code>'));
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      (_,e,u) => dep('<a class="vin" href="'+u.replace(/&/g,'&amp;')+'" target="_blank" rel="noopener">'+e+'</a>'));
  s = s.replace(/(https?:\/\/[^\s<]+)/g,
      u => dep('<a class="vin" href="'+u.replace(/&/g,'&amp;')+'" target="_blank" rel="noopener">'+u.replace(/^https?:\/\//,'')+'</a>'));
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/:([a-z0-9_+\-]+):/g, (m,n) => emo(n) || m);
  return s.replace(/\n/g,'<br>').replace(/\u0000(\d+)\u0000/g, (_,i) => cofre[+i]);
}
function textoDe(x){
  if (x == null) return '';
  if (typeof x === 'string') return x;
  if (Array.isArray(x)) return x.map(textoDe).join(' · ');
  const t = x.titulo || x.texto || x.tarea || x.nombre || '';
  const d = x.descripcion || x.detalle || x.objetivo || '';
  return t && d ? '**'+t+'** — '+d : (t || d || '');
}
function limpio(t){
  return String(t||'')
    .replace(/<(https?:\/\/[^|>\s]+)\|([^>]*)>/g,'$2').replace(/<(https?:\/\/[^|>\s]+)>/g,'$1')
    .replace(/<@[A-Z0-9]+\|([^>]+)>/g,'@$1').replace(/<#[A-Z0-9]+\|([^>]+)>/g,'#$1')
    .replace(/:([a-z0-9_+\-]+):/g,' ').replace(/[*_~`]/g,'').replace(/\s+/g,' ').trim();
}

const PALETA = ['#C0392B','#AF601A','#1E6F5C','#1A5276','#4A235A','#922B57',
                '#34495E','#5D4037','#00695C','#283593','#6A1B9A','#B9770E'];
function iniciales(n){
  const p = String(n||'?').trim().split(/\s+/).filter(x=>/[a-zA-ZÀ-ÿ]/.test(x[0]||''));
  if (!p.length) return '?';
  return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase();
}
function colorDe(n){ let h = 0; const s = String(n||'');
  for (let i=0;i<s.length;i++) h = (h*31+s.charCodeAt(i))>>>0; return PALETA[h%PALETA.length]; }
const av = n => '<span class="av" style="background:'+colorDe(n)+'">'+esc(iniciales(n))+'</span>';
const icoArch = t => /pdf/.test(t)?'📄' : /csv|sheet|excel/.test(t)?'📊'
  : /video|mp4/.test(t)?'🎥' : /image|png|jpe?g/.test(t)?'🖼️' : '📎';

function leerHash(){
  const t = decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean);
  if (!t.length){ vista = { ...vista, tipo:'portada', canal:null, acta:null }; return; }
  if (['actas','personas','archivos'].includes(t[0]) && !canalDe(t[0])){
    vista = { ...vista, tipo:t[0], canal:null, acta:null }; return;
  }
  const c = canalDe(t[0]);
  if (!c){ vista = { ...vista, tipo:'portada', canal:null, acta:null }; return; }
  vista = { tipo:'canal', canal:c.canal,
            pestana:['mensajes','actas','fijados','archivos'].includes(t[1]) ? t[1] : 'mensajes',
            acta:t[2] || null, sistema:vista.sistema };
}
function escribirHash(){
  const h = vista.tipo === 'portada' ? '#/'
    : vista.tipo !== 'canal' ? '#/'+vista.tipo
    : '#/'+vista.canal+'/'+vista.pestana+(vista.acta ? '/'+vista.acta : '');
  if (location.hash !== h && !(h === '#/' && !location.hash)){ saltar = true; location.hash = h; }
}
addEventListener('hashchange', () => {
  if (saltar){ saltar = false; return; }
  leerHash(); pintar(true);

/* ── gráfico de barras: una medida, un color, etiqueta solo en el pico ── */
function barras(serie, etiquetas, alto, idPrefijo, unidad){
  const max = Math.max(...serie, 1), iMax = serie.indexOf(max);
  let h = '<div class="plot" style="height:'+alto+'px" role="img" aria-label="'
        + esc(unidad)+' por semana, máximo '+max+'">';
  serie.forEach((v,i) => {

    h += '<div class="col" data-i="'+i+'" data-p="'+idPrefijo+'">'
       + (i===iMax ? '<span class="val">'+v+'</span>' : '<span class="fantasma">0</span>')
       + '<div class="bar" style="height:calc(('+alto+'px - 22px) * '+(pc/100).toFixed(4)+')"></div>'
       + '</div>';
  });
  h += '</div><div class="linea-base"></div><div class="ejex">'
     + etiquetas.map(e => '<span>'+esc(e)+'</span>').join('') + '</div>';

}

  const filas = [];
  for (const ca of (c ? [c] : A.canales))
    for (const m of ca.mensajes) for (const a of m.adjuntos)
      filas.push({ ...a, canal:ca, fecha:m.fecha });
  filas.sort((x,y) => y.fecha.localeCompare(x.fecha));
  if (!filas.length) return vacio('📎','Sin archivos','No hay adjuntos guardados aquí.');
  return '<div class="lista">'+filas.map(f =>
    '<div class="fila"><span class="ic">'+icoArch(f.tipo)+'</span><div class="cu">'
    + '<div class="t1">'+esc(f.nombre)+'</div>'
    + '<div class="t2">'+(c ? '' : '#'+esc(f.canal.nombre)+' · ')+esc(f.peso)+' · '+esc(f.tipo)+'</div></div>'
    + '<span class="dr">'+fechaCorta(f.fecha)+'</span></div>').join('')+'</div>'
    + '<div class="pista">Slack en plan gratuito conserva el <b>nombre</b> del archivo, no el archivo. '
    + 'Los PDF y las grabaciones viven en SharePoint; este índice dice qué se publicó, cuándo y dónde.</div>';
}

/* ── personas ── */
function pintarPersonas(){
  return '<div class="lista">'+A.personas.filter(p=>p.mensajes).map(p =>
    '<div class="fila">'+av(p.nombre)+'<div class="cu"><div class="t1">'+esc(p.nombre)+'</div>'
    + '<div class="t2">'+esc(p.correo||'—')+'</div></div>'
    + '<span class="dr">'+p.mensajes+' msj<br>'+p.canales.length+' canales</span></div>').join('')+'</div>';
}

const vacio = (ic,tt,tx) => '<div class="vacio"><div class="ic">'+ic+'</div><div class="tt">'+esc(tt)+'</div><p>'+esc(tx)+'</p></div>';

/* ── pintado ── */
function pintar(sinHash){
  if (!sinHash) escribirHash();
  pintarRail();
  let h = '', compacto = '';

  if (vista.tipo === 'portada'){
    compacto = 'Resumen';
    h = pintarPortada();
  }
  else if (vista.tipo === 'canal'){
    const c = canalDe(vista.canal);
    compacto = '#' + c.nombre;
    h = '<div class="titulon"><h1><span class="g">#</span>'+esc(c.nombre)+'</h1>'
      + '<div class="meta"><b>'+c.conteo+'</b> mensajes<i>·</i><b>'+c.actas.length+'</b> actas'
      + '<i>·</i><b>'+c.adjuntos+'</b> archivos<i>·</i>'+fechaCorta(c.desde)+' – '+fechaCorta(c.hasta)
      + '<i>·</i><span class="candado">🔒 privado</span></div>'
      + '<div class="segmentos">'
      + [['mensajes','Mensajes',c.conteo],['actas','Actas',c.actas.length],
         ['fijados','Fijados',(c.fijados||[]).length+(A.generales||[]).length],
         ['archivos','Archivos',c.adjuntos]]
        .map(([k,l,n]) => '<button class="'+(vista.pestana===k && !vista.acta ? 'sel' : '')+'" data-p="'+k+'">'
          + l + (n ? '<span class="n">'+n+'</span>' : '')+'</button>').join('')
      + '</div></div><div class="seccion">';

    if (vista.acta){
      const a = c.actas.find(x => x.archivo === vista.acta);
      h += a ? pintarActa(a, c.canal) : vacio('📄','Acta no encontrada','');
    }
    else if (vista.pestana === 'mensajes') h += pintarMensajes(c);
    else if (vista.pestana === 'actas')
      h += c.actas.length ? '<div class="tarjetas">'+c.actas.map(a=>tarjetaActa(a,c.canal,false)).join('')+'</div>'
         : vacio('📄','Sin actas','Este canal no tiene actas registradas.');
    else if (vista.pestana === 'fijados') h += pintarFijados(c);
    else h += pintarArchivos(c);
    h += '</div>';
  }
  else if (vista.tipo === 'actas'){
    compacto = 'Actas';
    const todas = [];
    for (const c of A.canales) for (const a of c.actas) todas.push({a, c});
    todas.sort((x,y) => y.a.iso.localeCompare(x.a.iso));
    h = '<div class="titulon"><h1>Actas</h1><div class="meta"><b>'+todas.length
      + '</b> sesiones documentadas<i>·</i>de la más reciente a la primera</div></div>'
      + '<div class="seccion"><div class="tarjetas">'
      + todas.map(({a,c}) => tarjetaActa(a, c.canal, true)).join('')+'</div></div>';
  }
  else if (vista.tipo === 'personas'){
    compacto = 'Personas';
    h = '<div class="titulon"><h1>Personas</h1><div class="meta"><b>'+TOTAL.gente
      + '</b> personas escribieron en el archivo</div></div><div class="seccion">'+pintarPersonas()+'</div>';
  }
  else {
    compacto = 'Archivos';
    h = '<div class="titulon"><h1>Archivos</h1><div class="meta"><b>'+TOTAL.arch
      + '</b> adjuntos publicados en los canales</div></div><div class="seccion">'+pintarArchivos(null)+'</div>';
  }

  $('#compacto').textContent = compacto;
  cuerpo.innerHTML = '<div class="lienzo">'+h+'</div>';
  cuerpo.scrollTop = 0; $('#barra').classList.remove('pegada');

  cuerpo.querySelectorAll('[data-p]').forEach(b => b.onclick = () => ir({ pestana:b.dataset.p, acta:null }));
  cuerpo.querySelectorAll('[data-c]').forEach(b => b.onclick = () =>
    ir({ tipo:'canal', canal:b.dataset.c, pestana:'mensajes', acta:null }));
  cuerpo.querySelectorAll('[data-a]').forEach(b => b.onclick = () =>
    ir({ tipo:'canal', canal:b.dataset.ac, pestana:'actas', acta:b.dataset.a }));
  cuerpo.querySelectorAll('[data-volver]').forEach(b => b.onclick = () => ir({ acta:null }));
  const alt = $('#alt-sis'); if (alt) alt.onclick = () => ir({ sistema:!vista.sistema });
  conectarGlobo(cuerpo);
}

/* título grande que se condensa al desplazar */
cuerpo.addEventListener('scroll', () => {
  $('#barra').classList.toggle('pegada', cuerpo.scrollTop > 26);
  globo.style.opacity = 0;
}, { passive:true });

/* ── paleta ⌘K ── */
let hits = [], act = 0;
const abrirPaleta = () => { document.body.classList.add('paleta'); $('#q').focus(); $('#q').select(); buscar(); };
const cerrarPaleta = () => document.body.classList.remove('paleta');
$('#btn-paleta').onclick = abrirPaleta;
$('#btn-paleta-2').onclick = abrirPaleta;
$('#velo-paleta').onclick = e => { if (e.target === $('#velo-paleta')) cerrarPaleta(); };
$('#btn-menu').onclick = () => document.body.classList.toggle('rail-abierto');
$('#velo').onclick = () => document.body.classList.remove('rail-abierto');

function recorte(t, q){
  const p = limpio(t), i = plano(p).indexOf(plano(q));
  if (i < 0) return esc(p.slice(0,86)) + (p.length>86?'…':'');
  const ini = Math.max(0, i-26), rec = p.slice(ini, i+q.length+62);
  const j = plano(rec).indexOf(plano(q));
  return (ini?'…':'') + esc(rec.slice(0,j)) + '<mark>' + esc(rec.slice(j,j+q.length))
       + '</mark>' + esc(rec.slice(j+q.length)) + '…';
}
function buscar(){
  const q = $('#q').value.trim(), nq = plano(q);
  hits = []; act = 0;
  if (!q){
    for (const c of A.canales.slice(0,8))
      hits.push({ k:'canal', c, t1:'#'+c.nombre, t2:c.conteo+' mensajes · '+c.actas.length+' actas', ic:'#', dr:'' });
    return render('Ir a');
  }
  for (const c of A.canales)
    if (plano(c.nombre).includes(nq) || plano(c.canal).includes(nq))
      hits.push({ k:'canal', c, t1:'#'+c.nombre, t2:c.conteo+' mensajes · '+c.actas.length+' actas', ic:'#', dr:'' });
  for (const c of A.canales) for (const a of c.actas){
    const campo = (a.area_completa||'')+' '+(a.area||'')+' sesion '+a.sesion_num+' '+(a.subtitulo_meta||'');
    if (plano(campo).includes(nq))
      hits.push({ k:'acta', c, a, ic:'◷', t1:(a.area_completa||c.nombre)+' · Sesión '+a.sesion_num,
                  t2:'#'+c.nombre, dr:fechaCorta(a.iso) });
  }
  const msgs = [];
  for (const c of A.canales) for (const m of c.mensajes){
    if (m.sistema) continue;
    if (plano(limpio(m.texto)).includes(nq) || plano(m.autor).includes(nq)
        || m.adjuntos.some(a => plano(a.nombre).includes(nq)))
      msgs.push({ k:'msg', c, m, ic:'≡', t1:recorte(m.texto, q), t2:m.autor+' · #'+c.nombre, dr:fechaCorta(m.fecha), bruto:true });
  }
  msgs.sort((x,y) => y.m.ts.localeCompare(x.m.ts));
  hits = hits.concat(msgs);
  render(null, q, msgs.length);
}
function render(titulo, q, nMsg){
  const res = $('#res');
  if (!hits.length){
    res.innerHTML = '<div class="vacio" style="padding:44px 20px"><div class="tt">Nada por aquí</div>'
      + '<p>No aparece en ninguno de los '+A.canales.length+' canales.</p></div>';
    return;
  }
  let h = '', grupo = null;
  hits.slice(0,70).forEach((x,i) => {
    const g = titulo || (x.k==='canal' ? 'Canales' : x.k==='acta' ? 'Actas'
              : 'Mensajes' + (nMsg>70 ? ' · '+miles(nMsg)+' coincidencias' : ''));
    if (g !== grupo){ grupo = g; h += '<div class="gr">'+esc(g)+'</div>'; }
    h += '<button class="ph'+(i===act?' act':'')+'" data-i="'+i+'">'
       + '<span class="ic">'+x.ic+'</span><div class="cu">'
       + '<div class="t1">'+(x.bruto ? x.t1 : esc(x.t1))+'</div>'
       + '<div class="t2">'+esc(x.t2)+'</div></div>'
       + (x.dr ? '<span class="dr">'+x.dr+'</span>' : '')+'</button>';
  });
  res.innerHTML = h;
  res.querySelectorAll('[data-i]').forEach(b => b.onclick = () => elegir(+b.dataset.i));
}
function elegir(i){
  const x = hits[i]; if (!x) return;
  if (x.k === 'acta') ir({ tipo:'canal', canal:x.c.canal, pestana:'actas', acta:x.a.archivo });
  else ir({ tipo:'canal', canal:x.c.canal, pestana:'mensajes', acta:null });
}
function mover(d){
  if (!hits.length) return;
  act = Math.max(0, Math.min(hits.length-1, Math.min(69, act+d)));
  $('#res').querySelectorAll('.ph').forEach((b,i) => b.classList.toggle('act', i===act));
  const a = $('#res').querySelector('.ph.act'); if (a) a.scrollIntoView({ block:'nearest' });
}
let reloj;
$('#q').addEventListener('input', () => { clearTimeout(reloj); reloj = setTimeout(buscar, 110); });
addEventListener('keydown', e => {
  const abierta = document.body.classList.contains('paleta');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); abierta ? cerrarPaleta() : abrirPaleta(); return; }
  if (!abierta){
    if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); abrirPaleta(); }
    if (e.key === 'Escape') document.body.classList.remove('rail-abierto');
    return;
  }
  if (e.key === 'Escape'){ e.preventDefault(); cerrarPaleta(); }
  if (e.key === 'ArrowDown'){ e.preventDefault(); mover(1); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); mover(-1); }
  if (e.key === 'Enter'){ e.preventDefault(); elegir(act); }
});

leerHash();
pintar(true);
</script>
