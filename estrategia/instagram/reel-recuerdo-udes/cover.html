<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,Arial,sans-serif}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,10,0) 30%,rgba(5,7,10,.93) 50%,#05070a 100%)}
.t{position:absolute;left:80px;right:80px;bottom:330px;color:#fff}
.eye{font:800 30px/1 "JetBrains Mono";letter-spacing:.22em;color:#ff4d4d}
h1{font-family:Georgia,serif;font-weight:400;font-size:132px;line-height:1;margin-top:26px}
em{font-style:normal;background:linear-gradient(90deg,#ff2d2d,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent}
.s{font:700 30px/1 "JetBrains Mono";letter-spacing:.16em;color:#9aa6b2;margin-top:34px}
.top{position:absolute;top:0;left:0;right:0;height:46%;background:linear-gradient(180deg,#05070a 0,#05070a 55%,rgba(5,7,10,0) 100%)}
.t2{position:absolute;top:150px;left:80px;right:80px;color:#fff}
</style></head><body>
<div class="c" id="c1"><img src="f1.jpg"><div class="sh"></div><div class="t"><p class="eye">⭕ RECUERDOS · PANEL UDES</p><h1>No es interrupción. <em>Es intención.</em></h1><p class="s">SANDRA CURVELO · iTECH 2025</p></div></div>
<div class="c" id="c2"><img src="f2.jpg" style="object-position:center 70%;transform:translateY(240px) scale(1.0)"><div class="top"></div><div class="t2"><p class="eye">⭕ RECUERDOS · PANEL UDES</p><h1 style="font-size:118px">¿Tu cliente se distrae <em>o te busca?</em></h1></div></div>
</body></html>
