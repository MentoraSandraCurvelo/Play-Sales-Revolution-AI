<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,Arial,sans-serif}
.eye{font:800 30px/1 "JetBrains Mono";letter-spacing:.22em;color:#ff4d4d}

.s{font:700 28px/1 "JetBrains Mono";letter-spacing:.16em;margin-top:30px}
.shot{position:absolute;left:90px;right:90px;border-radius:32px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.45)}

#c2{background:#efe6d8;color:#14181d}

<div class="c" id="c1"><div style="position:absolute;top:150px;left:80px;right:80px"><p class="eye">⭕ MATIA · DEMO SIMULADA</p><h1 style="font-size:112px">Mientras tú vendes, <em>tu agente actualiza tu CRM.</em></h1><p class="s" style="color:#9aa6b2">HECHO CON CLAUDE · IAM™</p></div>
<div class="shot" style="top:900px;height:760px;transform:rotate(-2deg)"><img src="f2.jpg" style="margin-top:-790px"></div></div>
<div class="c" id="c2"><div class="shot" style="top:120px;transform:rotate(2deg)"><img src="f2.jpg" style="margin-top:-80px;height:1100px;object-fit:cover;object-position:top"></div>
<div style="position:absolute;bottom:170px;left:80px;right:80px"><p class="eye" style="color:#c00000">⭕ MATIA · DEMO SIMULADA</p><h1 style="font-size:110px">10 toques de valor al día con tu agente de Claude, <em>mientras tu equipo vende.</em></h1><p class="s" style="color:#5a636d">HECHO CON CLAUDE · IAM™</p></div></div>
</body></html>
