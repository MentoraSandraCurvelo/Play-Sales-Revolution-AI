<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#efe6d8;font-family:"Helvetica Neue",Arial,sans-serif;position:relative;overflow:hidden}
.mono{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;text-transform:uppercase}
.tag{position:absolute;top:150px;left:80px;font-size:30px;letter-spacing:.3em;color:#e0201b;font-weight:800}
.ring{display:inline-block;width:28px;height:28px;border-radius:50%;border:6px solid #e0201b;vertical-align:-5px;margin-right:14px}
.card{position:absolute;top:250px;left:170px;width:740px;height:1120px;border-radius:36px;overflow:hidden;box-shadow:0 40px 90px rgba(10,12,16,.35);transform:rotate(-2deg);background:url(portada-reunion.jpg) center/cover}
h1{position:absolute;left:80px;right:80px;top:1460px;font-family:Georgia,serif;font-weight:400;font-size:84px;line-height:1.08;color:#0b0d10}
h1 em{font-style:normal;background:linear-gradient(90deg,#e0201b,#f0a020);-webkit-background-clip:text;background-clip:text;color:transparent}
.cta{position:absolute;left:80px;top:1720px;font-size:32px;letter-spacing:.24em;color:#2b3036;font-weight:700}
.sign{position:absolute;left:80px;bottom:80px;font-size:26px;letter-spacing:.24em;color:#6b7280}
</style></head><body>
<p class="tag mono"><span class="ring"></span>Nuevo reel</p>
<div class="card"></div>
<h1>El cliente nota si llegaste <em>preparado.</em></h1>
<p class="cta mono">Míralo en mi perfil ↑</p>
<p class="sign mono">Sandra Curvelo · IAM™</p>
</body></html>
