<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,Arial,sans-serif}
.eye{font:800 30px/1 "JetBrains Mono";letter-spacing:.22em;color:#ff4d4d}
h1{font-family:Georgia,serif;font-weight:400;font-size:112px;line-height:1.02;margin-top:26px}
em{font-style:normal;background:linear-gradient(90deg,#ff2d2d,#ffb020);-webkit-background-clip:text;background-clip:text;color:transparent}
.s{font:700 28px/1 "JetBrains Mono";letter-spacing:.16em;margin-top:30px}
.shot{position:absolute;left:90px;right:90px;border-radius:32px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.45)}
.shot img{display:block;width:100%}
.me{position:absolute;width:450px;height:450px;border-radius:50%;overflow:hidden;border:10px solid #ff2d2d;box-shadow:0 24px 60px rgba(0,0,0,.35);z-index:3}
.me img{width:100%;height:100%;object-fit:cover}
#c1{background:#e8e9eb;color:#14181d}
#c2{background:radial-gradient(900px 700px at 15% 0%,#15263a 0,transparent 60%),radial-gradient(900px 700px at 100% 100%,#2a0b0e 0,transparent 60%),#05070a;color:#fff}
</style></head><body>
<div class="c" id="c1"><div style="position:absolute;top:150px;left:80px;right:80px"><p class="eye" style="color:#c00000">⭕ AGENTE EN LINKEDIN · DEMO</p><h1>Tu agente prospecta en LinkedIn. <em>Tú solo apruebas.</em></h1><p class="s" style="color:#5a636d">HECHO CON CLAUDE · IAM™</p></div>
<div class="shot" style="top:1000px;height:760px;transform:rotate(-2deg)"><img src="f2.jpg" style="margin-top:-880px"></div>
<div class="me" style="top:740px;right:50px"><img src="sandra.jpg"></div></div>
<div class="c" id="c2"><div class="shot" style="top:110px;height:820px;transform:rotate(2deg)"><img src="f2.jpg" style="margin-top:-880px"></div>
<div class="me" style="top:700px;left:60px"><img src="sandra.jpg"></div>
<div style="position:absolute;bottom:160px;left:80px;right:80px"><p class="eye">⭕ AGENTE EN LINKEDIN · DEMO</p><h1 style="font-size:104px">En LinkedIn, el agente propone. <em>Tú apruebas.</em></h1><p class="s" style="color:#9aa6b2">HECHO CON CLAUDE · IAM™</p></div></div>
</body></html>
