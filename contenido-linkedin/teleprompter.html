<title>Teleprompter Sandra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
<style>
/* Layout: barra de control fija arriba, guion a pantalla completa con línea de lectura; diseño oscuro único a propósito (lectura frente a cámara) */
:root{
  --bg:#0b0b0c; --panel:#161618; --fg:#f4f2ee; --muted:#9a968f; --line:#2a2a2d; --red:#e00000; --red-hi:#ff4d4d;
  --f:"Outfit",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f)}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.bar select{font:600 15px var(--f);color:var(--fg);background:#232326;border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
.bar button.on{background:var(--red);border-color:var(--red)}
.bar button:focus-visible,.bar select:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.bar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bar input[type=range]{width:110px;accent-color:var(--red)}
.sp{flex:1}
#play{min-width:120px}
#stage{height:100%;overflow-y:auto;scroll-behavior:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage.mirror #script{transform:scaleX(-1)}
#script{max-width:900px;margin:0 auto;padding-block:45vh 70vh;font-size:var(--size,44px);line-height:1.45;font-weight:600}
#script p{margin:0 0 1.1em}
#script .cue{display:block;font-size:.42em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red-hi);margin-bottom:.35em}
#script .fill{color:#ffd166}
.guide{position:fixed;left:0;right:0;top:40%;height:0;border-top:2px dashed rgba(224,0,0,.55);pointer-events:none;z-index:2}
.note{max-width:900px;margin:0 auto;font-size:16px;color:var(--muted);padding-top:120px}
@media (max-width:640px){#script{font-size:calc(var(--size,44px)*.7)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar">
  <select id="pick" aria-label="Guion">
    <option value="iae">Video IAE™ (índice)</option>
    <option value="ajustes">Video 5 ajustes</option>
    <option value="guia">Video guía: semana del vendedor con IA</option>
    <option value="voz">Voz: el vendedor que hace caso</option>
  </select>
  <button id="play" type="button">▶ Iniciar</button>
  <button id="top" type="button">Inicio</button>
  <label for="speed">Velocidad <input id="speed" type="range" min="10" max="120" value="40"></label>
  <label for="size">Letra <input id="size" type="range" min="28" max="80" value="44"></label>
  <span class="sp"></span>
  <button id="mir" type="button">Espejo</button>
</div>
<div class="guide" aria-hidden="true"></div>
<div id="stage"><div id="script"></div></div>

<script>
(function(){
  const S={
    iae:`<p><span class="cue">Gancho · a cámara</span>Tu empresa pagó licencias de IA. ¿Sabes quién las está usando de verdad?</p>
<p><span class="cue">El problema</span>La mayoría de las empresas no lo sabe. Compran, capacitan, y después no tienen forma de saber si eso cambió algo.</p>
<p><span class="cue">Tu creación</span>Por eso creé el IAE™, el Índice de Actividad de Inteligencia Artificial Empresarial. Un tablero por área que muestra, en tiempo real, quién está usando la IA, quién no, y cuántas horas se están recuperando cada día.</p>
<p><span class="cue">Las 4 fuentes · cuenta con los dedos</span>Se alimenta de 4 fuentes. Uno, la adopción: el uso real de las licencias, que llega solo, semana a semana. Dos, las horas recuperadas: una línea base por persona, tarea por tarea, validada en sesión. Tres, los tableros y agentes que cada área tiene funcionando, verificados cada 15 días. Y cuatro, la calidad: una encuesta anónima y el visto bueno del jefe a los entregables. No es una autoevaluación. Son datos cruzados.</p>
<p><span class="cue">Los tableros · en pantalla</span>Primero, las horas: cuántas horas ahorra hoy cada área con IA, y quién sube y quién baja frente a su línea base. Y después, los procesos: cuáles van al día, cuáles están en riesgo y cuánto se cerró hoy.</p>
<p><span class="cue">El valor</span>Con eso la conversación con la gerencia cambia. Ya no es "estamos usando IA". Es "esta área subió, esta bajó, y estas son las horas que recuperamos esta semana".</p>
<p><span class="cue">Cierre · a cámara</span>Lo que no se mide no puede ser mejorado. Y la IA no es la excepción. Si quieres ver cómo se vería en tu empresa, escríbeme.</p>`,
    ajustes:`<p><span class="cue">Gancho · a cámara</span>¿Usas la IA como buscador? Preguntas, copias la respuesta y cierras la ventana.</p>
<p><span class="cue">El problema</span>Así la mayoría de los equipos están desperdiciando la herramienta que más productividad les puede dar.</p>
<p><span class="cue">Los 5 ajustes · muestra la pantalla</span>Te doy 5 ajustes para que Claude deje de ser un buscador y empiece a trabajar contigo.</p>
<p>Uno: usa la app de escritorio, no solo el navegador.</p>
<p>Dos: crea un proyecto por área, con sus archivos y sus instrucciones.</p>
<p>Tres: conéctala a tus herramientas. Tu correo, tu Drive, tu calendario.</p>
<p>Cuatro: crea una habilidad para las tareas que repites cada semana.</p>
<p>Cinco: programa las tareas que se hacen solas. <span class="fill">[por confirmar]</span></p>
<p><span class="cue">Consejo</span>No tienes que activar los 5 hoy. Empieza con uno.</p>
<p><span class="cue">Empresas</span>Y si lo vas a llevar a tu empresa, hazlo con licencias empresariales y reglas claras. Tu información lo vale.</p>
<p><span class="cue">Cierre · a cámara</span>Comenta <span class="fill">[palabra clave]</span> y te dejo la guía.</p>`,
    guia:`<p><span class="cue">Gancho · a cámara</span>Llega el lunes, abres el computador y piensas: ¿y ahora yo qué hago?</p>
<p><span class="cue">El problema</span>Eso tiene nombre: el síndrome de la hoja en blanco. Y el viernes llega el otro: el cliente que dejó de responder después de la propuesta.</p>
<p><span class="cue">La guía · arriba se ve cada día</span>Por eso armé esta guía: la semana de un vendedor que trabaja con inteligencia artificial.</p>
<p>Lunes: el agente revisa tu CRM, tu pipeline y tu forecast, y te dice tus 10 acciones de la semana.</p>
<p>Martes: segmenta por industria y te encuentra los prospectos ideales en LinkedIn.</p>
<p>Miércoles: te deja listos los correos por segmento, para que los revises y los envíes.</p>
<p>Jueves: prepara tu publicación y tus comentarios de la semana.</p>
<p>Viernes: reactiva las propuestas sin respuesta y te deja listo el lunes.</p>
<p><span class="cue">La regla</span>La inteligencia artificial prepara. Tú decides y envías.</p>
<p><span class="cue">Cierre · a cámara</span>La guía completa está en este post. Guárdala y compártela con tu equipo comercial.</p>`,
    voz:`<p><span class="cue">Solo voz · graba una nota de voz en un lugar sin eco</span>Le pidieron una propuesta. La envió el mismo día, con el precio que le pidieron. Y perdió. O peor: ganó sin rentabilidad.</p>
<p>En las mentorías con equipos comerciales siempre hago la misma pregunta antes de que alguien envíe una cotización: ¿cuál es tu estrategia comercial?</p>
<p>Casi siempre hay silencio. Nos acostumbramos a ser vendedores que hacen caso: el cliente dice "dame tu mejor precio" y salimos corriendo a bajarlo.</p>
<p><span class="cue">Los 5 vectores · despacio</span>Antes de cotizar, en la reunión inicial, reviso 5 vectores. Uno, el presupuesto. Dos, los tomadores de decisión. Tres, la competencia. Cuatro, la forma de compra. Y cinco, el tiempo: para cuándo lo necesita de verdad.</p>
<p>Si el cliente se quiere ir de su proveedor por mal servicio, tienes todas las de ganar. No lleves el mejor precio: lleva tu oferta de valor.</p>
<p>Y el descuento llega al final, cuando el cliente negocia. Nunca regalado: si quieres este descuento, algo sale de la oferta, y lo tengo que pedir a gerencia.</p>
<p><span class="cue">Cierre</span>Cuando la venta se vuelve una subasta, la empresa pierde rentabilidad. ¿Tu equipo cotiza con estrategia o porque se lo pidieron?</p>`
  };
  const stage=document.getElementById('stage'),box=document.getElementById('script'),
        pick=document.getElementById('pick'),play=document.getElementById('play'),
        speed=document.getElementById('speed'),size=document.getElementById('size');
  let running=false,last=0,acc=0;
  function load(){box.innerHTML=S[pick.value];stage.scrollTop=0;stop()}
  function stop(){running=false;play.textContent='▶ Iniciar';play.classList.remove('on')}
  function tick(t){
    if(!running)return;
    const dt=last?(t-last)/1000:0;last=t;
    acc+=dt*Number(speed.value);
    if(acc>=1){const n=Math.floor(acc);stage.scrollTop+=n;acc-=n}
    if(stage.scrollTop+stage.clientHeight>=stage.scrollHeight-2){stop();return}
    requestAnimationFrame(tick);
  }
  play.onclick=()=>{if(running){stop();return}running=true;last=0;play.textContent='❚❚ Pausa';play.classList.add('on');requestAnimationFrame(tick)};
  document.getElementById('top').onclick=()=>{stage.scrollTop=0;stop()};
  document.getElementById('mir').onclick=e=>{stage.classList.toggle('mirror');e.currentTarget.classList.toggle('on')};
  size.oninput=()=>{box.style.setProperty('--size',size.value+'px')};
  pick.onchange=load;
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='SELECT'){e.preventDefault();play.click()}});
  load();
})();
</script>
