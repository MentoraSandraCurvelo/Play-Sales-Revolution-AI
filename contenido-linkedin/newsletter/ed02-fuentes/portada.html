<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portada edición 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&display=swap">
<style>
@font-face{font-family:Outfit;src:url(/mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Regular.ttf);font-weight:400}
@font-face{font-family:Outfit;src:url(/mnt/skills/examples/canvas-design/canvas-fonts/Outfit-Bold.ttf);font-weight:700}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#080808;color:#fff;font-family:Outfit,sans-serif}
body::before{content:"";position:absolute;left:0;top:0;bottom:0;width:20px;background:#E00000;z-index:3}
.glow{position:absolute;right:120px;top:120px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(224,0,0,.55) 0%,rgba(224,0,0,.18) 40%,rgba(8,8,8,0) 70%)}
.ring{position:absolute;right:230px;top:190px;width:580px;height:580px;border:3px solid rgba(255,60,60,.55);border-radius:50%}
.foto{position:absolute;right:150px;bottom:0;height:1000px;filter:drop-shadow(0 0 40px rgba(224,0,0,.35))}
.fade{position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(to top,#080808,rgba(8,8,8,0))}
.txt{position:absolute;left:110px;top:120px;width:960px;z-index:2}
.eb{font-weight:700;font-size:34px;color:#FF2A2A;letter-spacing:.02em;text-transform:uppercase}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:900;font-size:96px;line-height:1.02;margin-top:30px}
h1 .r{color:#E00000}
.sub{margin-top:44px;font-size:42px;font-weight:700;line-height:1.2}
.sub2{max-width:820px;margin-top:12px;font-size:38px;color:#cfc9c2;line-height:1.25}
.box{display:inline-block;background:#fff;color:#C00000;padding:2px 14px;border-radius:8px}
.dias{position:absolute;left:110px;top:720px;display:flex;gap:14px;z-index:2}.dias span{font-weight:700;font-size:30px;padding:12px 22px;border:2px solid #E00000;border-radius:10px;color:#fff}.dias span.on{background:#E00000}
.firma{position:absolute;left:110px;bottom:84px;font-weight:700;font-size:32px;z-index:2}
.firma span{color:#FF2A2A}
</style></head><body>
<div class="glow"></div><div class="ring"></div>
<img class="foto" src="sandra-blazer-blanco-recorte.png" alt="">
<div class="fade"></div>
<div class="txt">
<p class="eb">Lo que nadie te dice de la IA · Edición 2</p>
<h1>Tu vendedor no necesita otro <span class="r">curso.</span></h1>
<p class="sub">Necesita trabajar con IA, <span class="box">con método.</span></p>
<p class="sub2">Para líderes comerciales: la semana del vendedor con IA, de lunes a viernes.</p>
</div>
<div class="dias"><span class="on">LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span></div>
<p class="firma">Sandra Curvelo <span>·</span> Founder &amp; CSO IAM™</p>
</body></html>
