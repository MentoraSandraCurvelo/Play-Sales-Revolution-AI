<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:#fff;font-family:'Helvetica Neue',Arial,sans-serif;color:#16163a;padding:70px 72px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#e9e6ff 0%,#fff 70%);right:-260px;top:300px;z-index:0}
.z{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:700;letter-spacing:.06em}
.tag{border:2px solid #16163a;margin-left:auto;padding:9px 18px;border-radius:40px;font-size:20px}
h1{font-size:68px;line-height:1.05;margin-top:40px;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#5b3df5,#0fb5a6);-webkit-background-clip:text;color:transparent}
.sub{font-size:28px;color:#5d5d7a;margin-top:18px;line-height:1.35}
.main{display:flex;align-items:center;gap:30px;margin-top:34px}
.leg{flex:1}
.it{display:flex;align-items:center;gap:16px;margin:20px 0;font-size:25px}
.dot{width:22px;height:22px;border-radius:7px;flex:none}
.it b{margin-left:auto;font-size:25px;white-space:nowrap}
.it small{color:#8a8aa3;font-weight:400}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:22px;color:#5d5d7a}
.foot .s{color:#5b3df5;font-weight:700}
.rings{font-size:22px;color:#5d5d7a;display:flex;gap:28px;margin-top:6px}
.strip{margin-top:30px;background:#16163a;color:#fff;border-radius:22px;padding:28px 36px;display:flex;justify-content:space-between;align-items:center}
.strip .k{font-size:24px;opacity:.75}.strip .v{font-size:42px;font-weight:800}
.strip .v span{color:#5fe0d2}
</style></head><body><div class="glow"></div>
<div class="z top"><img src="../logo-sandra-oscuro.png" style="height:86px"><div class="tag">TABLERO DE LA SEMANA · 01</div></div>
<h1 class="z">La semana de un vendedor,<br><span>antes y después de la IA.</span></h1>
<p class="z sub">Una semana de 40 horas. Anillo exterior: antes. Anillo interior: semana 9 de un piloto medido.</p>
<div class="z main">
 <svg id="c" width="470" height="470" viewBox="0 0 470 470"></svg>
 <div class="leg" id="leg"></div>
</div>
<div class="z strip"><div><div class="k">Tiempo para vender</div><div class="v">26 h <span>→ 34,25 h</span></div></div><div style="text-align:right"><div class="k">Horas devueltas</div><div class="v"><span>+8,25 h</span></div></div></div>
<div class="z foot"><div class="s">Datos simulados de demostración</div><div>IAM™ Intelligence · iamlatam.co</div></div>
<script>
const T=[["Propuestas y cotizaciones","#5b3df5",5,2],["Reportes y CRM","#0fb5a6",4,1.5],["Correos de seguimiento","#f2a541",3,1.25],["Preparar reuniones","#ef6f6c",2,1]];
const sell=["Vender y conversar","#e6e6f0"];
const svg=document.getElementById('c'),C=235;
function arc(r,a0,a1,w,col){const p=(a)=>[C+r*Math.cos(a-Math.PI/2),C+r*Math.sin(a-Math.PI/2)];const [x0,y0]=p(a0),[x1,y1]=p(a1);const l=(a1-a0)>Math.PI?1:0;const e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',`M${x0} ${y0} A${r} ${r} 0 ${l} 1 ${x1} ${y1}`);e.setAttribute('stroke',col);e.setAttribute('stroke-width',w);e.setAttribute('fill','none');e.setAttribute('stroke-linecap','butt');svg.appendChild(e)}
function ring(r,w,idx){let a=0;const g=0.012;let used=0;T.forEach(t=>{const s=t[idx]/40*2*Math.PI;arc(r,a+g,a+s-g,w,t[1]);a+=s;used+=t[idx]});arc(r,a+g,2*Math.PI-g,w,sell[1]);}
ring(205,46,2);ring(145,46,3);
const tx=(y,s,t,c,wt)=>{const e=document.createElementNS('http://www.w3.org/2000/svg','text');e.setAttribute('x',C);e.setAttribute('y',y);e.setAttribute('text-anchor','middle');e.setAttribute('font-size',s);e.setAttribute('fill',c);e.setAttribute('font-weight',wt);e.setAttribute('font-family','Helvetica Neue, Arial');e.textContent=t;svg.appendChild(e)};
tx(222,22,'Tareas que se repiten','#5d5d7a',400);tx(268,44,'14 h → 5,75 h','#16163a',800);
document.getElementById('leg').innerHTML=T.map(t=>`<div class="it"><div class="dot" style="background:${t[1]}"></div>${t[0]}<b>${String(t[2]).replace('.',',')} → ${String(t[3]).replace('.',',')} h</b></div>`).join('')+`<div class="it"><div class="dot" style="background:${sell[1]}"></div>${sell[0]}<b><small>el resto</small></b></div>`;
</script></body></html>
